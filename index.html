<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Cá Nhân & Công Việc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-0 sm:p-4">

    <!-- Mobile Frame -->
    <div class="w-full sm:max-w-md bg-slate-50 min-h-screen sm:min-h-[844px] sm:rounded-[36px] shadow-2xl flex flex-col justify-between overflow-hidden relative border-gray-200 border">

        <!-- Header -->
        <header class="p-5 bg-white flex justify-between items-center border-b border-gray-100">
            <h1 id="header-title" class="text-xl font-bold text-gray-800">Công Việc</h1>
            <div class="flex gap-1.5">
                <!-- Nút Xuất/Nhập dữ liệu dự phòng -->
                <button onclick="exportData()" title="Tải file sao lưu" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1.5 rounded-lg font-medium">
                    <i class="fa-solid fa-download"></i> Tải về
                </button>
                <button onclick="document.getElementById('import-file-input').click()" title="Nhập file sao lưu" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1.5 rounded-lg font-medium">
                    <i class="fa-solid fa-upload"></i> Khôi phục
                </button>
                <input type="file" id="import-file-input" class="hidden" accept=".json" onchange="importData(event)">
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 p-4 overflow-y-auto hide-scrollbar pb-20">
            <!-- Content render -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bg-white border-t border-gray-100 flex justify-around py-3 absolute bottom-0 w-full z-10">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-gray-400">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-xs mt-1 font-medium">Trang chủ</span>
            </button>
            <button onclick="switchTab('projects')" id="nav-projects" class="flex flex-col items-center text-blue-600">
                <i class="fa-solid fa-list-check text-lg"></i>
                <span class="text-xs mt-1 font-medium">Công việc</span>
            </button>
            <button onclick="switchTab('finance')" id="nav-finance" class="flex flex-col items-center text-gray-400">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-xs mt-1 font-medium">Cá nhân</span>
            </button>
        </nav>
    </div>

    <!-- Modal Standard -->
    <div id="modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl relative max-h-[90vh] overflow-y-auto hide-scrollbar">
            <h3 id="modal-title" class="font-bold text-lg text-gray-800 mb-4">Thêm mới</h3>
            <div id="modal-body" class="space-y-3"></div>
            <div class="flex justify-end gap-2 mt-5">
                <button onclick="closeModal()" class="px-4 py-2 text-xs font-bold text-gray-500 rounded-lg bg-gray-100">Hủy</button>
                <button id="modal-save-btn" class="px-4 py-2 text-xs font-bold text-white bg-blue-600 rounded-lg">Lưu lại</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-xs px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
        <i class="fa-solid fa-check text-green-400"></i>
        <span id="toast-msg">Thông báo</span>
    </div>

    <script>
        // Key cố định duy nhất cho ứng dụng
        const MASTER_KEY = 'MY_APP_MASTER_DATA';

        // Khởi tạo dữ liệu chuẩn
        function initStore() {
            const rawData = localStorage.getItem(MASTER_KEY);
            if (rawData) {
                try {
                    return JSON.parse(rawData);
                } catch (e) {
                    console.error("Lỗi đọc dữ liệu:", e);
                }
            }
            
            // Nếu là lần đầu mở app (chưa có dữ liệu), tạo cấu trúc rỗng
            return {
                tasks: [],
                cards: [],
                loans: [],
                lends: []
            };
        }

        let store = initStore();
        let currentTab = 'projects';

        function saveData() {
            localStorage.setItem(MASTER_KEY, JSON.stringify(store));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('nav button').forEach(btn => btn.className = 'flex flex-col items-center text-gray-400');
            document.getElementById(`nav-${tab}`).className = 'flex flex-col items-center text-blue-600';
            render();
        }

        // --- XUẤT / NHẬP FILE DỮ LIỆU BẢO VỆ ---
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(store, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `Backup_App_Data_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('Đã tải xuống file sao lưu dữ liệu!');
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const parsedData = JSON.parse(e.target.result);
                    if (parsedData && typeof parsedData === 'object') {
                        store = {
                            tasks: parsedData.tasks || [],
                            cards: parsedData.cards || [],
                            loans: parsedData.loans || [],
                            lends: parsedData.lends || []
                        };
                        saveData();
                        render();
                        showToast('Khôi phục dữ liệu thành công!');
                    }
                } catch(err) {
                    alert('File sao lưu không hợp lệ!');
                }
            };
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0]);
            }
        }

        // --- QUẢN LÝ CÔNG VIỆC ---
        function addTask() {
            const inp = document.getElementById('task-inp');
            if (inp && inp.value.trim()) {
                store.tasks.push({
                    id: Date.now(),
                    text: inp.value.trim(),
                    done: false
                });
                saveData();
                render();
                inp.value = '';
            }
        }

        function toggleTask(id) {
            const task = store.tasks.find(t => t.id === id);
            if (task) {
                task.done = !task.done;
                saveData();
                render();
            }
        }

        function deleteTask(id) {
            if (confirm("Xóa công việc này?")) {
                store.tasks = store.tasks.filter(t => t.id !== id);
                saveData();
                render();
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        // --- HIỂN THỊ GIAO DIỆN ---
        function render() {
            const main = document.getElementById('main-content');
            const title = document.getElementById('header-title');

            if (currentTab === 'projects') {
                title.innerText = 'Công Việc';
                main.innerHTML = `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4">
                        <div class="flex gap-2 mb-3">
                            <input id="task-inp" type="text" placeholder="Nhập công việc mới..." class="flex-1 p-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500" onkeypress="if(event.key==='Enter') addTask()">
                            <button onclick="addTask()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 rounded-lg text-xs font-bold shadow-sm">Thêm</button>
                        </div>
                        <div class="space-y-2 mt-3">
                            ${store.tasks.length === 0 ? '<p class="text-xs text-gray-400 italic py-6 text-center">Chưa có công việc nào. Hãy nhập ở trên để thêm!</p>' : ''}
                            ${store.tasks.map(t => `
                                <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-lg border border-gray-100">
                                    <label class="flex items-center gap-2 cursor-pointer flex-1 mr-2">
                                        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})" class="rounded text-blue-600 w-4 h-4">
                                        <span class="text-xs font-medium ${t.done ? 'line-through text-gray-400' : 'text-gray-700'}">${t.text}</span>
                                    </label>
                                    <button onclick="deleteTask(${t.id})" class="text-gray-400 hover:text-red-500 text-xs px-2 py-1"><i class="fa-regular fa-trash-can"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentTab === 'home') {
                title.innerText = 'Trang Chủ';
                main.innerHTML = `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                        <p class="text-xs text-gray-500 mb-2">Tổng số công việc hiện có:</p>
                        <p class="text-2xl font-bold text-blue-600">${store.tasks.length}</p>
                    </div>
                `;
            } else if (currentTab === 'finance') {
                title.innerText = 'Cá Nhân';
                main.innerHTML = `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-xs text-gray-600">
                        Khu vực cài đặt và thông tin cá nhân.
                    </div>
                `;
            }
        }

        switchTab('projects');
    </script>
</body>
</html>
