<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Cá Nhân</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-0 sm:p-4">

    <!-- Mobile Frame -->
    <div class="w-full sm:max-w-md bg-slate-50 min-h-screen sm:min-h-[844px] sm:rounded-[36px] shadow-2xl flex flex-col justify-between overflow-hidden relative border-gray-200 border">

        <!-- Header -->
        <header class="p-5 bg-white flex justify-between items-center border-b border-gray-100">
            <h1 id="header-title" class="text-xl font-bold text-gray-800">Công Việc</h1>
            <div class="flex gap-2">
                <button onclick="openRecoveryModal()" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-800 px-2.5 py-1.5 rounded-lg font-bold">
                    <i class="fa-solid fa-life-ring mr-1"></i> Tìm dữ liệu cũ
                </button>
                <button onclick="clearCache()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-2.5 py-1.5 rounded-lg font-medium">
                    <i class="fa-solid fa-arrows-rotate mr-1"></i> Làm mới
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 p-4 overflow-y-auto hide-scrollbar pb-20">
            <!-- Content render -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bg-white border-t border-gray-100 flex justify-around py-3 absolute bottom-0 w-full z-10">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-gray-400">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-xs mt-1 font-medium">Trang chủ</span>
            </button>
            <button onclick="switchTab('projects')" id="nav-projects" class="flex flex-col items-center text-blue-600">
                <i class="fa-solid fa-list-check text-lg"></i>
                <span class="text-xs mt-1 font-medium">Công việc</span>
            </button>
            <button onclick="switchTab('finance')" id="nav-finance" class="flex flex-col items-center text-gray-400">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-xs mt-1 font-medium">Cá nhân</span>
            </button>
        </nav>
    </div>

    <!-- Modal Standard -->
    <div id="modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl relative max-h-[90vh] overflow-y-auto hide-scrollbar">
            <h3 id="modal-title" class="font-bold text-lg text-gray-800 mb-4">Thêm mới</h3>
            <div id="modal-body" class="space-y-3"></div>
            <div class="flex justify-end gap-2 mt-5">
                <button onclick="closeModal()" class="px-4 py-2 text-xs font-bold text-gray-500 rounded-lg bg-gray-100">Hủy</button>
                <button id="modal-save-btn" class="px-4 py-2 text-xs font-bold text-white bg-blue-600 rounded-lg">Lưu lại</button>
            </div>
        </div>
    </div>

    <!-- Modal Khôi phục dữ liệu nâng cao -->
    <div id="recovery-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-xl relative max-h-[85vh] flex flex-col">
            <h3 class="font-bold text-lg text-gray-800 mb-2">Bộ Khôi Phục Dữ Liệu</h3>
            <p class="text-xs text-gray-500 mb-4">Dưới đây là tất cả các mục dữ liệu cũ được tìm thấy trong trình duyệt của bạn:</p>
            <div id="recovery-list" class="flex-1 overflow-y-auto space-y-2 pr-1 my-2"></div>
            <div class="flex justify-end gap-2 mt-4 pt-2 border-t">
                <button onclick="closeRecoveryModal()" class="px-4 py-2 text-xs font-bold text-gray-600 rounded-lg bg-gray-100">Đóng</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-xs px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
        <i class="fa-solid fa-check text-green-400"></i>
        <span id="toast-msg">Đã chép nội dung</span>
    </div>

    <script>
        const STORAGE_KEY = 'my_app_tasks_v2026';

        function loadStore() {
            let defaultStore = {
                tasks: [
                    { id: 1, text: 'Thanh toán tiền điện tháng này', done: false },
                    { id: 2, text: 'Kiểm tra sao kê thẻ VPBank', done: true }
                ],
                cards: [],
                loans: [],
                lends: []
            };

            let saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { return JSON.parse(saved); } catch(e){}
            }
            return defaultStore;
        }

        let store = loadStore();
        let currentTab = 'projects';

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        function clearCache() {
            if (confirm("Làm mới ứng dụng?")) {
                location.reload();
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('nav button').forEach(btn => btn.className = 'flex flex-col items-center text-gray-400');
            document.getElementById(`nav-${tab}`).className = 'flex flex-col items-center text-blue-600';
            render();
        }

        // --- KHÔI PHỤC DỮ LIỆU CŨ ---
        function openRecoveryModal() {
            const modal = document.getElementById('recovery-modal');
            const list = document.getElementById('recovery-list');
            list.innerHTML = '';

            let foundAny = false;

            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                let rawVal = localStorage.getItem(key);
                try {
                    let parsed = JSON.parse(rawVal);
                    
                    // Tìm mảng công việc
                    let tasksFound = [];
                    if (Array.isArray(parsed)) {
                        tasksFound = parsed.filter(x => x && x.text);
                    } else if (parsed && Array.isArray(parsed.tasks)) {
                        tasksFound = parsed.tasks.filter(x => x && x.text);
                    }

                    if (tasksFound.length > 0) {
                        foundAny = true;
                        let itemHtml = `
                            <div class="p-3 bg-gray-50 border rounded-xl">
                                <div class="text-xs font-bold text-gray-700 mb-1">Nguồn: ${key} (${tasksFound.length} công việc)</div>
                                <ul class="text-[11px] text-gray-600 list-disc list-inside mb-2">
                                    ${tasksFound.slice(0, 3).map(t => `<li>${t.text}</li>`).join('')}
                                    ${tasksFound.length > 3 ? `<li>...và ${tasksFound.length - 3} mục khác</li>` : ''}
                                </ul>
                                <button onclick="importTasksFromKey('${key}')" class="w-full py-1.5 bg-blue-600 text-white font-bold text-xs rounded-lg">Khôi phục danh sách này</button>
                            </div>
                        `;
                        list.innerHTML += itemHtml;
                    }
                } catch(e){}
            }

            if (!foundAny) {
                list.innerHTML = `<div class="text-center py-6 text-gray-400 text-xs">Không tìm thấy dữ liệu công việc cũ nào khác trong bộ nhớ trình duyệt.</div>`;
            }

            modal.classList.remove('hidden');
        }

        function closeRecoveryModal() {
            document.getElementById('recovery-modal').classList.add('hidden');
        }

        function importTasksFromKey(key) {
            try {
                let rawVal = localStorage.getItem(key);
                let parsed = JSON.parse(rawVal);
                let tasksToImport = [];

                if (Array.isArray(parsed)) tasksToImport = parsed;
                else if (parsed && Array.isArray(parsed.tasks)) tasksToImport = parsed.tasks;

                if (tasksToImport.length > 0) {
                    // Trộn dữ liệu mới vào store hiện tại
                    tasksToImport.forEach(item => {
                        if (item && item.text && !store.tasks.some(t => t.text === item.text)) {
                            store.tasks.push({
                                id: Date.now() + Math.random(),
                                text: item.text,
                                done: !!item.done
                            });
                        }
                    });
                    saveData();
                    render();
                    closeRecoveryModal();
                    showToast('Đã khôi phục dữ liệu thành công!');
                }
            } catch(e) {
                alert('Không thể khôi phục dữ liệu này.');
            }
        }

        // --- TASKS HANDLERS ---
        function addTask() {
            const inp = document.getElementById('task-inp');
            if (inp && inp.value.trim()) {
                store.tasks.push({ id: Date.now(), text: inp.value.trim(), done: false });
                saveData(); render();
            }
        }

        function toggleTask(id) {
            const task = store.tasks.find(t => t.id === id);
            if (task) { task.done = !task.done; saveData(); render(); }
        }

        function deleteTask(id) {
            store.tasks = store.tasks.filter(t => t.id !== id);
            saveData(); render();
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function render() {
            const main = document.getElementById('main-content');
            const title = document.getElementById('header-title');

            if (currentTab === 'projects') {
                title.innerText = 'Công Việc';
                main.innerHTML = `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4">
                        <div class="flex gap-2 mb-3">
                            <input id="task-inp" type="text" placeholder="Nhập công việc mới..." class="flex-1 p-2.5 border border-gray-200 rounded-lg text-sm">
                            <button onclick="addTask()" class="bg-blue-600 text-white px-4 rounded-lg text-xs font-bold shadow-sm">Thêm</button>
                        </div>
                        <div class="space-y-2 mt-3">
                            ${store.tasks.length === 0 ? '<p class="text-xs text-gray-400 italic py-2 text-center">Chưa có công việc nào</p>' : ''}
                            ${store.tasks.map(t => `
                                <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-lg border border-gray-100">
                                    <label class="flex items-center gap-2 cursor-pointer flex-1 mr-2">
                                        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})" class="rounded text-blue-600 w-4 h-4">
                                        <span class="text-xs font-medium ${t.done ? 'line-through text-gray-400' : 'text-gray-700'}">${t.text}</span>
                                    </label>
                                    <button onclick="deleteTask(${t.id})" class="text-gray-400 hover:text-red-500 text-xs px-2 py-1"><i class="fa-regular fa-trash-can"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentTab === 'home') {
                title.innerText = 'Trang Chủ';
                main.innerHTML = `<div class="p-4 text-center text-xs text-gray-500">Chuyển sang tab Công việc để quản lý.</div>`;
            } else if (currentTab === 'finance') {
                title.innerText = 'Cá Nhân';
                main.innerHTML = `<div class="p-4 text-center text-xs text-gray-500">Khu vực thông tin cá nhân.</div>`;
            }
        }

        switchTab('projects');
    </script>
</body>
</html>
