<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Cá Nhân</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-0 sm:p-4">

    <!-- Mobile Frame -->
    <div class="w-full sm:max-w-md bg-slate-50 min-h-screen sm:min-h-[844px] sm:rounded-[36px] shadow-2xl flex flex-col justify-between overflow-hidden relative border-gray-200 border">

        <!-- Header -->
        <header class="p-5 bg-white flex justify-between items-center border-b border-gray-100">
            <h1 id="header-title" class="text-xl font-bold text-gray-800">Trang chủ</h1>
            <button onclick="alert('Không có thông báo mới')" class="text-gray-500 relative">
                <i class="fa-regular fa-bell text-xl"></i>
                <span class="absolute -top-1 -right-1 bg-red-500 w-2.5 h-2.5 rounded-full"></span>
            </button>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 p-4 overflow-y-auto hide-scrollbar pb-20">
            <!-- Nội dung render qua JS -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bg-white border-t border-gray-100 flex justify-around py-3 absolute bottom-0 w-full z-10">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-blue-600">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-xs mt-1 font-medium">Trang chủ</span>
            </button>
            <button onclick="switchTab('projects')" id="nav-projects" class="flex flex-col items-center text-gray-400">
                <i class="fa-solid fa-list-check text-lg"></i>
                <span class="text-xs mt-1 font-medium">Công việc</span>
            </button>
            <button onclick="switchTab('finance')" id="nav-finance" class="flex flex-col items-center text-gray-400">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-xs mt-1 font-medium">Cá nhân</span>
            </button>
        </nav>
    </div>

    <!-- Application Logic -->
    <script>
        let store = JSON.parse(localStorage.getItem('my_app_data')) || {
            projects: [
                {
                    id: 1, name: 'DVCI Đà Lạt', color: 'blue', note: 'Dự án trọng điểm quý 3. Cần kiểm tra kỹ tiến độ nộp hồ sơ.',
                    tasks: [
                        { id: 101, title: 'Chuẩn bị hồ sơ', date: '2026-08-10', done: true },
                        { id: 102, title: 'Kiểm tra dự toán', date: '2026-08-11', done: true },
                        { id: 103, title: 'Đăng hồ sơ lên hệ thống', date: '2026-08-19', done: false }
                    ]
                }
            ],
            cards: [
                { id: 1, bank: 'VPBank', info: 'Visa Platinum - 4567', statementDay: 15, dueDay: 5 }
            ],
            loans: [
                { id: 1, bank: 'Ngân hàng A', name: 'Khoản vay A', totalAmount: 20000000, months: 12, paidMonths: 5 }
            ]
        };

        let currentTab = 'home';
        let activeProjectId = null;

        function saveData() {
            localStorage.setItem('my_app_data', JSON.stringify(store));
        }

        function switchTab(tab) {
            currentTab = tab;
            activeProjectId = null;
            document.querySelectorAll('nav button').forEach(btn => btn.className = 'flex flex-col items-center text-gray-400');
            document.getElementById(`nav-${tab}`).className = 'flex flex-col items-center text-blue-600';
            render();
        }

        function toggleTask(projId, taskId) {
            const proj = store.projects.find(p => p.id === projId);
            if (proj) {
                const task = proj.tasks.find(t => t.id === taskId);
                if (task) task.done = !task.done;
                saveData();
                render();
            }
        }

        function addProject() {
            const name = prompt("Nhập tên dự án mới:");
            if (name) {
                store.projects.push({ id: Date.now(), name, note: '', tasks: [] });
                saveData();
                render();
            }
        }

        function addTask(projId) {
            const title = prompt("Nhập tên nhiệm vụ:");
            if (title) {
                const proj = store.projects.find(p => p.id === projId);
                proj.tasks.push({ id: Date.now(), title, date: new Date().toISOString().split('T')[0], done: false });
                saveData();
                render();
            }
        }

        function saveProjectNote(projId) {
            const noteText = document.getElementById(`proj-note-${projId}`).value;
            const proj = store.projects.find(p => p.id === projId);
            if (proj) {
                proj.note = noteText;
                saveData();
                alert('Đã lưu ghi chú đặc thù!');
            }
        }

        function addCreditCard() {
            const bank = prompt("Nhập tên ngân hàng:");
            if (!bank) return;
            const info = prompt("Thông tin thẻ (ví dụ: Visa ****1234):") || "Thẻ tín dụng";
            const statementDay = prompt("Ngày sao kê hàng tháng (ví dụ: 15):", "15");
            const dueDay = prompt("Hạn thanh toán hàng tháng (ví dụ: 5):", "05");

            store.cards.push({ id: Date.now(), bank, info, statementDay, dueDay });
            saveData();
            render();
        }

        function addLoan() {
            const bank = prompt("Vay của ngân hàng/đơn vị nào:");
            if (!bank) return;
            const name = prompt("Tên khoản vay / Món đồ trả góp:");
            const totalAmount = parseFloat(prompt("Tổng số tiền vay (VNĐ):", "10000000")) || 0;
            const months = parseInt(prompt("Thời gian vay (số tháng: 3, 6, 12, 24...):", "12")) || 12;

            store.loans.push({ id: Date.now(), bank, name: name || "Khoản vay", totalAmount, months, paidMonths: 0 });
            saveData();
            render();
        }

        function incrementLoanPaid(loanId) {
            const loan = store.loans.find(l => l.id === loanId);
            if (loan && loan.paidMonths < loan.months) {
                loan.paidMonths++;
                saveData();
                render();
            }
        }

        function render() {
            const main = document.getElementById('main-content');
            const title = document.getElementById('header-title');

            if (activeProjectId) {
                renderProjectDetail(activeProjectId);
                return;
            }

            if (currentTab === 'home') {
                title.innerText = 'Trang chủ';
                main.innerHTML = `
                    <div class="mb-4">
                        <span class="text-xs text-gray-500 font-medium">Hôm nay</span>
                        <h2 class="text-lg font-bold text-gray-800">Thứ Ba, 18/08/2026</h2>
                    </div>

                    <div class="mb-6">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-gray-700">Dự án & Công việc</h3>
                            <button onclick="addProject()" class="text-blue-600 text-sm font-semibold">+ Thêm</button>
                        </div>
                        ${renderProjectCards()}
                    </div>

                    <div>
                        <h3 class="font-bold text-gray-700 mb-3">Tài chính cá nhân</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <div onclick="switchTab('finance')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 cursor-pointer">
                                <i class="fa-solid fa-credit-card text-blue-500 text-xl mb-2"></i>
                                <div class="font-semibold text-sm">Thẻ tín dụng</div>
                                <div class="text-xs text-gray-500 mt-1">${store.cards.length} thẻ đang quản lý</div>
                            </div>
                            <div onclick="switchTab('finance')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 cursor-pointer">
                                <i class="fa-solid fa-wallet text-purple-500 text-xl mb-2"></i>
                                <div class="font-semibold text-sm">Khoản vay/Góp</div>
                                <div class="text-xs text-gray-500 mt-1">${store.loans.length} khoản đang trả</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'projects') {
                title.innerText = 'Công việc';
                main.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-gray-800 text-lg">Danh sách dự án</h2>
                        <button onclick="addProject()" class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">+</button>
                    </div>
                    ${renderProjectCards()}
                `;
            } else if (currentTab === 'finance') {
                title.innerText = 'Tài chính Cá nhân';
                main.innerHTML = `
                    <!-- Thẻ tín dụng -->
                    <div class="mb-6">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-gray-800 text-base">Thẻ tín dụng ngân hàng</h3>
                            <button onclick="addCreditCard()" class="text-blue-600 text-sm font-semibold">+ Thêm thẻ</button>
                        </div>
                        ${store.cards.length === 0 ? '<p class="text-xs text-gray-400 italic">Chưa có thẻ nào</p>' : ''}
                        ${store.cards.map(c => `
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-3">
                                <div class="flex justify-between items-start mb-1">
                                    <div class="font-bold text-gray-800 text-base">${c.bank}</div>
                                    <span class="text-xs bg-blue-50 text-blue-600 px-2 py-0.5 rounded font-medium">${c.info}</span>
                                </div>
                                <div class="flex justify-between text-xs text-gray-600 my-2 pt-2 border-t border-gray-50">
                                    <div>Ngày sao kê: <b class="text-gray-800">${c.statementDay} hàng tháng</b></div>
                                    <div>Hạn thanh toán: <b class="text-red-500">${c.dueDay} hàng tháng</b></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Trả góp -->
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-gray-800 text-base">Khoản vay / Trả góp</h3>
                            <button onclick="addLoan()" class="text-blue-600 text-sm font-semibold">+ Thêm khoản vay</button>
                        </div>
                        ${store.loans.length === 0 ? '<p class="text-xs text-gray-400 italic">Chưa có khoản vay nào</p>' : ''}
                        ${store.loans.map(l => {
                            const percent = Math.round((l.paidMonths / l.months) * 100);
                            const monthlyAmount = Math.round(l.totalAmount / l.months);
                            return `
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-3">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <div class="font-bold text-gray-800">${l.name}</div>
                                        <div class="text-xs text-blue-600 font-medium">Ngân hàng: ${l.bank}</div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-xs text-gray-400">Tổng vay</div>
                                        <div class="font-bold text-gray-800 text-sm">${l.totalAmount.toLocaleString()} đ</div>
                                    </div>
                                </div>

                                <div class="flex justify-between text-xs text-gray-500 my-3 bg-slate-50 p-2 rounded-lg">
                                    <div>Thời gian: <b>${l.months} tháng</b></div>
                                    <div>Mỗi tháng: <b>${monthlyAmount.toLocaleString()} đ</b></div>
                                </div>

                                <div class="flex justify-between items-center text-xs mb-1">
                                    <span class="text-gray-500">Đã thanh toán: <b>${l.paidMonths}/${l.months} kỳ</b></span>
                                    <span class="font-bold text-green-600">${percent}%</span>
                                </div>
                                <div class="w-full bg-gray-100 rounded-full h-2 mb-3">
                                    <div class="bg-green-500 h-2 rounded-full" style="width: ${percent}%"></div>
                                </div>

                                ${l.paidMonths < l.months ? `
                                    <button onclick="incrementLoanPaid(${l.id})" class="w-full py-2 bg-green-50 text-green-600 rounded-lg text-xs font-bold hover:bg-green-100 transition">
                                        <i class="fa-solid fa-check mr-1"></i> Tích đã trả 1 kỳ tháng này
                                    </button>
                                ` : `
                                    <div class="text-center text-xs text-green-600 font-bold bg-green-50 py-1.5 rounded-lg">✓ Đã hoàn thành khoản vay</div>
                                `}
                            </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }
        }

        function renderProjectCards() {
            return store.projects.map(p => {
                const total = p.tasks.length;
                const done = p.tasks.filter(t => t.done).length;
                const percent = total > 0 ? Math.round((done / total) * 100) : 0;
                
                return `
                    <div onclick="openProject(${p.id})" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-3 cursor-pointer">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center">
                                    <i class="fa-solid fa-folder text-lg"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-gray-800">${p.name}</h4>
                                    <span class="text-xs text-gray-400">${done}/${total} nhiệm vụ</span>
                                </div>
                            </div>
                            <span class="text-xs font-bold text-gray-500">${percent}%</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-1.5 mt-2">
                            <div class="bg-blue-600 h-1.5 rounded-full" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openProject(id) {
            activeProjectId = id;
            render();
        }

        function renderProjectDetail(id) {
            const p = store.projects.find(proj => proj.id === id);
            const title = document.getElementById('header-title');
            title.innerText = p.name;

            const total = p.tasks.length;
            const done = p.tasks.filter(t => t.done).length;
            const percent = total > 0 ? Math.round((done / total) * 100) : 0;

            const main = document.getElementById('main-content');
            main.innerHTML = `
                <button onclick="activeProjectId=null; render()" class="text-sm text-blue-600 mb-3 flex items-center gap-1 font-medium">
                    <i class="fa-solid fa-arrow-left"></i> Quay lại
                </button>

                <!-- Banner Dự án -->
                <div class="bg-blue-600 text-white p-5 rounded-2xl mb-4 shadow-lg">
                    <h2 class="text-xl font-bold mb-1">${p.name}</h2>
                    <p class="text-xs opacity-80 mb-3">${done}/${total} nhiệm vụ hoàn thành</p>
                    <div class="flex items-center justify-between gap-4">
                        <div class="w-full bg-blue-400 rounded-full h-2">
                            <div class="bg-white h-2 rounded-full" style="width: ${percent}%"></div>
                        </div>
                        <span class="text-lg font-bold">${percent}%</span>
                    </div>
                </div>

                <!-- Ghi chú đặc thù dự án -->
                <div class="bg-white p-4 rounded-xl border border-gray-100 mb-5">
                    <h4 class="font-bold text-gray-700 text-xs uppercase mb-2"><i class="fa-regular fa-note-sticky mr-1"></i> Đặc thù dự án / Ghi chú</h4>
                    <textarea id="proj-note-${p.id}" rows="3" class="w-full p-2 border border-gray-200 rounded-lg text-xs text-gray-700 focus:outline-none focus:border-blue-500" placeholder="Nhập quy định, đặc thù riêng cho dự án này...">${p.note || ''}</textarea>
                    <button onclick="saveProjectNote(${p.id})" class="mt-2 text-xs bg-gray-800 text-white px-3 py-1.5 rounded-lg font-semibold hover:bg-black transition">Lưu ghi chú</button>
                </div>

                <!-- Danh sách công việc -->
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-gray-700">Danh sách nhiệm vụ</h3>
                    <button onclick="addTask(${p.id})" class="text-blue-600 text-sm font-semibold">+ Thêm nhiệm vụ</button>
                </div>

                <div class="space-y-2">
                    ${p.tasks.map((t, idx) => `
                        <div class="bg-white p-3 rounded-xl border border-gray-100 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <span class="text-xs text-gray-400 font-bold w-4">${idx + 1}</span>
                                <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${p.id}, ${t.id})" class="w-5 h-5 accent-blue-600 rounded cursor-pointer">
                                <span class="text-sm ${t.done ? 'line-through text-gray-400' : 'text-gray-800 font-medium'}">${t.title}</span>
                            </div>
                            <span class="text-[11px] text-gray-400"><i class="fa-regular fa-calendar mr-1"></i>${t.date}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
