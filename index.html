<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Cá Nhân & Công Việc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: {
                            50: '#f4f7f4',
                            100: '#e3ebe4',
                            500: '#7CA982',
                            600: '#648f6a',
                            700: '#4e7053',
                        },
                        cream: '#F9F9F6',
                        warmYellow: {
                            100: '#fef9e7',
                            400: '#f7e79d',
                            500: '#f4d35e',
                        },
                        slateDark: '#2B3A42',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-200 flex justify-center items-center min-h-screen p-0 sm:p-4">

    <!-- Mobile Frame -->
    <div class="w-full sm:max-w-md bg-cream min-h-screen sm:min-h-[844px] sm:rounded-[36px] shadow-2xl flex flex-col justify-between overflow-hidden relative border-gray-200 border">

        <!-- Header -->
        <header class="px-5 pt-5 pb-3 bg-white/80 backdrop-blur-md flex justify-between items-center border-b border-sage-100 sticky top-0 z-20">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-bars text-lg text-slateDark cursor-pointer"></i>
                <h1 id="header-title" class="text-xl font-bold text-slateDark">Công việc</h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="clearCache()" class="text-xs bg-sage-50 hover:bg-sage-100 text-sage-700 px-2.5 py-1.5 rounded-xl transition">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
                <button id="header-add-btn" onclick="handleHeaderAdd()" class="w-8 h-8 rounded-full bg-warmYellow-400 hover:bg-warmYellow-500 text-slateDark flex items-center justify-center font-bold shadow-sm transition">
                    <i class="fa-solid fa-plus text-sm"></i>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 px-4 pt-3 overflow-y-auto hide-scrollbar pb-24">
            <!-- Content render -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bg-white/90 backdrop-blur-md border-t border-sage-100 flex justify-around py-3 absolute bottom-0 w-full z-10">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-gray-400 hover:text-sage-500 transition">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Trang chủ</span>
            </button>
            <button onclick="switchTab('projects')" id="nav-projects" class="flex flex-col items-center text-sage-600 font-semibold">
                <i class="fa-solid fa-border-all text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Công việc</span>
            </button>
            <button onclick="switchTab('finance')" id="nav-finance" class="flex flex-col items-center text-gray-400 hover:text-sage-500 transition">
                <i class="fa-regular fa-user text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Cá nhân</span>
            </button>
        </nav>
    </div>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 bg-slateDark/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl relative max-h-[90vh] overflow-y-auto hide-scrollbar border border-sage-100">
            <h3 id="modal-title" class="font-bold text-lg text-slateDark mb-4">Thêm mới</h3>
            <div id="modal-body" class="space-y-3"></div>
            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeModal()" class="px-4 py-2 text-xs font-bold text-gray-500 rounded-xl bg-gray-100 hover:bg-gray-200 transition">Hủy</button>
                <button id="modal-save-btn" class="px-5 py-2 text-xs font-bold text-slateDark bg-warmYellow-400 hover:bg-warmYellow-500 rounded-xl shadow-sm transition">Lưu lại</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-slateDark text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
        <i class="fa-solid fa-check text-warmYellow-400"></i>
        <span id="toast-msg">Đã chép nội dung</span>
    </div>

    <script>
        const STORAGE_KEY = 'my_unified_app_data_v2';

        function loadCombinedStore() {
            let store = {
                projects: [
                    { id: 1, name: 'DVCI Đà Lạt', amount: 50000000, startDate: '2026-08-01', note: 'Dự án dịch vụ công', type: 'DVCI', collapsed: false, tasks: [
                        { id: 101, text: 'Khảo sát hiện trạng', done: true },
                        { id: 102, text: 'Lập hồ sơ kỹ thuật', done: true },
                        { id: 103, text: 'Triển khai hạ tầng', done: false }
                    ]},
                    { id: 2, name: 'Dự án B', amount: 20000000, startDate: '2026-08-05', note: 'Vé điện tử', type: 'G-Ticket', collapsed: false, tasks: [
                        { id: 201, text: 'Tích hợp Gateway', done: true },
                        { id: 202, text: 'Kiểm thử ứng dụng', done: false }
                    ]}
                ],
                singleTasks: [
                    { id: 1, text: 'Nộp báo cáo công việc tuần', priority: 'Gấp', dueDate: '2026-08-20', done: false }
                ],
                cards: [
                    { id: 1, bank: 'VPBank', cardType: 'Visa', limit: 50000000, days: '45 ngày', info: 'Thẻ thanh toán chính', statementDate: '15', dueDate: '5' }
                ],
                loans: [
                    { id: 1, bank: 'VPBank', name: 'Khoản vay mua xe', totalAmount: 24000000, monthlyPay: 2000000, startDate: '2026-01-10', months: 12, paidMonths: [1, 2, 3] }
                ],
                lends: [
                    { id: 1, borrower: 'Nguyễn Văn A', type: 'Cá nhân', amount: 10000000, startDate: '2026-08-01', note: 'Cho vay ngắn hạn', completed: false }
                ]
            };

            let savedMain = localStorage.getItem(STORAGE_KEY);
            if (savedMain) {
                try { store = JSON.parse(savedMain); } catch(e){}
            }
            return store;
        }

        let store = loadCombinedStore();
        let currentTab = 'projects';
        let workSubTab = 'projects';
        let financeSubTab = 'cards';

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        function clearCache() {
            if (confirm("Làm mới dữ liệu?")) {
                localStorage.clear();
                location.reload();
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('nav button').forEach(btn => btn.className = 'flex flex-col items-center text-gray-400 hover:text-sage-500 transition');
            document.getElementById(`nav-${tab}`).className = 'flex flex-col items-center text-sage-600 font-semibold';
            render();
        }

        function switchWorkSubTab(sub) {
            workSubTab = sub;
            render();
        }

        function switchFinanceSubTab(sub) {
            financeSubTab = sub;
            render();
        }

        function handleHeaderAdd() {
            if (currentTab === 'projects') {
                if (workSubTab === 'projects') openModal('project');
                else openModal('singleTask');
            } else if (currentTab === 'finance') {
                if (financeSubTab === 'cards') openModal('card');
                else if (financeSubTab === 'loans') openModal('loan');
                else if (financeSubTab === 'lends') openModal('lend');
            }
        }

        function formatNumberInput(input) {
            let val = input.value.replace(/,/g, '').replace(/\D/g, '');
            input.value = val ? Number(val).toLocaleString('en-US') : '';
        }

        function getRawNumber(value) {
            return parseFloat(String(value).replace(/,/g, '')) || 0;
        }

        function formatDate(dateStr) {
            if (!dateStr || !dateStr.includes('-')) return dateStr || '';
            const d = new Date(dateStr);
            return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
        }

        function renderDayOptions(selected = '') {
            let opts = `<option value="">Chọn ngày</option>`;
            for (let i = 1; i <= 31; i++) {
                opts += `<option value="${i}" ${String(selected) === String(i) ? 'selected' : ''}>Ngày ${i}</option>`;
            }
            return opts;
        }

        function validateFields(fieldIds) {
            let isValid = true;
            fieldIds.forEach(id => {
                const el = document.getElementById(id);
                if (el && !el.value.trim()) {
                    el.classList.add('border-red-400');
                    isValid = false;
                } else if (el) {
                    el.classList.remove('border-red-400');
                }
            });
            return isValid;
        }

        function toggleProjectCollapse(projectId) {
            const project = store.projects.find(p => p.id === projectId);
            if (project) {
                project.collapsed = !project.collapsed;
                saveData();
                render();
            }
        }

        function toggleProjectTask(projectId, taskId) {
            const project = store.projects.find(p => p.id === projectId);
            if (project && project.tasks) {
                const task = project.tasks.find(t => t.id === taskId);
                if (task) {
                    task.done = !task.done;
                    saveData();
                    render();
                }
            }
        }

        function addProjectTask(projectId) {
            const input = document.getElementById(`inp-new-task-${projectId}`);
            if (!input || !input.value.trim()) return;

            const project = store.projects.find(p => p.id === projectId);
            if (project) {
                if (!project.tasks) project.tasks = [];
                project.tasks.push({
                    id: Date.now(),
                    text: input.value.trim(),
                    done: false
                });
                saveData();
                render();
            }
        }

        function deleteProjectTask(projectId, taskId) {
            const project = store.projects.find(p => p.id === projectId);
            if (project && project.tasks) {
                project.tasks = project.tasks.filter(t => t.id !== taskId);
                saveData();
                render();
            }
        }

        function toggleSingleTask(id) {
            const t = store.singleTasks.find(x => x.id === id);
            if (t) { t.done = !t.done; saveData(); render(); }
        }

        function deleteProject(id) {
            if (confirm('Xóa dự án này?')) {
                store.projects = store.projects.filter(p => p.id !== id);
                saveData(); render();
            }
        }

        function deleteSingleTask(id) {
            store.singleTasks = store.singleTasks.filter(t => t.id !== id);
            saveData(); render();
        }

        function deleteCard(id) {
            if (confirm('Xóa thẻ này?')) {
                store.cards = store.cards.filter(c => c.id !== id);
                saveData(); render();
            }
        }

        function deleteLoan(id) {
            if (confirm('Xóa khoản vay này?')) {
                store.loans = store.loans.filter(l => l.id !== id);
                saveData(); render();
            }
        }

        function deleteLend(id) {
            if (confirm('Xóa khoản này?')) {
                store.lends = store.lends.filter(l => l.id !== id);
                saveData(); render();
            }
        }

        function toggleLendStatus(lendId) {
            const lend = store.lends.find(l => l.id === lendId);
            if (lend) {
                lend.completed = !lend.completed;
                saveData(); render();
            }
        }

        function toggleLoanMonth(loanId, monthIndex) {
            const loan = store.loans.find(l => l.id === loanId);
            if (loan) {
                if (!Array.isArray(loan.paidMonths)) loan.paidMonths = [];
                const idx = loan.paidMonths.indexOf(monthIndex);
                if (idx > -1) loan.paidMonths.splice(idx, 1);
                else loan.paidMonths.push(monthIndex);
                saveData(); render();
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function openModal(type, editId = null) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            const saveBtn = document.getElementById('modal-save-btn');

            modal.classList.remove('hidden');

            if (type === 'project') {
                const item = editId ? store.projects.find(p => p.id === editId) : null;
                title.innerText = item ? 'Sửa Dự Án' : 'Thêm Dự Án Mới';
                body.innerHTML = `
                    <div>
                        <label class="text-xs text-slateDark font-semibold mb-1 block">Tên dự án *</label>
                        <input id="inp-p-name" type="text" value="${item ? item.name : ''}" placeholder="Nhập tên..." class="w-full p-2.5 border border-sage-100 rounded-xl text-sm focus:outline-none focus:border-sage-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-slateDark font-semibold mb-1 block">Loại *</label>
                            <select id="inp-p-type" class="w-full p-2.5 border border-sage-100 rounded-xl text-sm bg-white">
                                <option value="DVCI" ${item && item.type === 'DVCI' ? 'selected' : ''}>DVCI</option>
                                <option value="G-Ticket" ${item && item.type === 'G-Ticket' ? 'selected' : ''}>G-Ticket</option>
                                <option value="Khác" ${item && item.type === 'Khác' ? 'selected' : ''}>Khác</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs text-slateDark font-semibold mb-1 block">Số tiền (VNĐ)</label>
                            <input id="inp-p-amount" type="text" value="${item && item.amount ? item.amount.toLocaleString() : ''}" oninput="formatNumberInput(this)" placeholder="0" class="w-full p-2.5 border border-sage-100 rounded-xl text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-slateDark font-semibold mb-1 block">Ngày bắt đầu</label>
                        <input id="inp-p-start" type="date" value="${item ? item.startDate : new Date().toISOString().split('T')[0]}" class="w-full p-2.5 border border-sage-100 rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-slateDark font-semibold mb-1 block">Ghi chú</label>
                        <textarea id="inp-p-note" rows="2" class="w-full p-2.5 border border-sage-100 rounded-xl text-sm" placeholder="Ghi chú...">${item ? item.note || '' : ''}</textarea>
                    </div>
                `;
                saveBtn.onclick = () => {
                    if (!validateFields(['inp-p-name'])) return;
                    const data = {
                        id: editId || Date.now(),
                        name: document.getElementById('inp-p-name').value,
                        type: document.getElementById('inp-p-type').value,
                        amount: getRawNumber(document.getElementById('inp-p-amount').value),
                        startDate: document.getElementById('inp-p-start').value,
                        note: document.getElementById('inp-p-note').value,
                        collapsed: item ? !!item.collapsed : false,
                        tasks: item ? item.tasks : []
                    };
                    if (editId) {
                        const idx = store.projects.findIndex(p => p.id === editId);
                        store.projects[idx] = data;
                    } else {
                        store.projects.push(data);
                    }
                    saveData(); closeModal(); render();
                };
            } else if (type === 'singleTask') {
                const item = editId ? store.singleTasks.find(t => t.id === editId) : null;
                title.innerText = item ? 'Sửa Việc Riêng Lẻ' : 'Thêm Việc Riêng Lẻ';
                body.innerHTML = `
                    <div>
                        <label class="text-xs text-slateDark font-semibold mb-1 block">Nội dung *</label>
                        <input id="inp-t-text" type="text" value="${item ? item.text : ''}" placeholder="Tên việc..." class="w-full p-2.5 border border-sage-100 rounded-xl text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-slateDark font-semibold mb-1 block">Mức ưu tiên</label>
                            <select id="inp-t-priority" class="w-full p-2.5 border border-sage-100 rounded-xl text-sm bg-white">
                                <option value="Bình thường" ${item && item.priority === 'Bình thường' ? 'selected' : ''}>Bình thường</option>
                                <option value="Gấp" ${item && item.priority === 'Gấp' ? 'selected' : ''}>Gấp</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs text-slateDark font-semibold mb-1 block">Hạn chót</label>
                            <input id="inp-t-date" type="date" value="${item ? item.dueDate : ''}" class="w-full p-2.5 border border-sage-100 rounded-xl text-sm">
                        </div>
                    </div>
                `;
                saveBtn.onclick = () => {
                    if (!validateFields(['inp-t-text'])) return;
                    const data = {
                        id: editId || Date.now(),
                        text: document.getElementById('inp-t-text').value,
                        priority: document.getElementById('inp-t-priority').value,
                        dueDate: document.getElementById('inp-t-date').value,
                        done: item ? item.done : false
                    };
                    if (editId) {
                        const idx = store.singleTasks.findIndex(t => t.id === editId);
                        store.singleTasks[idx] = data;
                    } else {
                        store.singleTasks.push(data);
                    }
                    saveData(); closeModal(); render();
                };
            } else if (type === 'card') {
                const item = editId ? store.cards.find(c => c.id === editId) : null;
                title.innerText = item ? 'Sửa Thẻ Tín Dụng' : 'Thêm Thẻ Tín Dụng';
                body.innerHTML = `
                    <div>
                        <label class="text-xs text-slateDark font-semibold mb-1 block">Tên ngân hàng *</label>
                        <input id="inp-bank" type="text" value="${item ? item.bank : ''}" placeholder="VPBank, MB..." class="w-full p-2.5 border border-sage-100 rounded-xl text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-slateDark font-semibold mb-1 block">Loại thẻ</label>
                            <select id="inp-card-type" class="w-full p-2.5 border border-sage-100 rounded-xl text-sm bg-white">
                                <option value="Visa" ${item && item.cardType === 'Visa' ? 'selected' : ''}>Visa</option>
                                <option value="JCB" ${item && item.cardType === 'JCB' ? 'selected' : ''}>JCB</option>
                                <option value="Mastercard" ${item && item.cardType === 'Mastercard' ? 'selected' : ''}>Mastercard</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs text-slateDark font-semibold mb-1 block">Thời hạn</label>
                            <select id="inp-days" class="w-full p-2.5 border border-sage-100 rounded-xl text-sm bg-white">
                                <option value="45 ngày" ${item && item.days === '45 ngày' ? 'selected' : ''}>45 ngày</option>
                                <option value="55 ngày" ${item && item.days === '55 ngày' ? 'selected' : ''}>55 ngày</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-slateDark font-semibold mb-1 block">Hạn mức *</label>
                        <input id="inp-limit" type="text" value="${item ? item.limit.toLocaleString() : ''}" oninput="formatNumberInput(this)" placeholder="50,000,000" class="w-full p-2.5 border border-sage-100 rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-slateDark font-semibold mb-1 block">Ghi chú</label>
                        <textarea id="inp-info" rows="2" class="w-full p-2.5 border border-sage-100 rounded-xl text-sm">${item ? item.info : ''}</textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-slateDark font-semibold mb-1 block">Ngày sao kê *</label>
                            <select id="inp-statement" class="w-full p-2.5 border border-sage-100 rounded-xl text-sm bg-white">${renderDayOptions(item ? item.statementDate : '')}</select>
                        </div>
                        <div>
                            <label class="text-xs text-slateDark font-semibold mb-1 block">Hạn thanh toán *</label>
                            <select id="inp-due" class="w-full p-2.5 border border-sage-100 rounded-xl text-sm bg-white">${renderDayOptions(item ? item.dueDate : '')}</select>
                        </div>
                    </div>
                `;
                saveBtn.onclick = () => {
                    if (!validateFields(['inp-bank', 'inp-limit', 'inp-statement', 'inp-due'])) return;
                    const data = {
                        id: editId || Date.now(),
                        bank: document.getElementById('inp-bank').value,
                        cardType: document.getElementById('inp-card-type').value,
                        days: document.getElementById('inp-days').value,
                        limit: getRawNumber(document.getElementById('inp-limit').value),
                        info: document.getElementById('inp-info').value,
                        statementDate: document.getElementById('inp-statement').value,
                        dueDate: document.getElementById('inp-due').value
                    };
                    if (editId) {
                        const idx = store.cards.findIndex(c => c.id === editId);
                        store.cards[idx] = data;
                    } else {
                        store.cards.push(data);
                    }
                    saveData(); closeModal(); render();
                };
            }
        }

        function render() {
            const main = document.getElementById('main-content');
            const title = document.getElementById('header-title');

            if (currentTab === 'projects') {
                title.innerText = 'Công việc';
                let html = `
                    <div class="flex gap-2 mb-4 bg-sage-50 p-1 rounded-2xl border border-sage-100">
                        <button onclick="switchWorkSubTab('projects')" class="flex-1 py-1.5 text-xs font-semibold rounded-xl transition ${workSubTab === 'projects' ? 'bg-white text-slateDark shadow-sm' : 'text-gray-500'}">Dự án (${store.projects.length})</button>
                        <button onclick="switchWorkSubTab('singles')" class="flex-1 py-1.5 text-xs font-semibold rounded-xl transition ${workSubTab === 'singles' ? 'bg-white text-slateDark shadow-sm' : 'text-gray-500'}">Việc riêng lẻ (${store.singleTasks.length})</button>
                    </div>
                `;

                if (workSubTab === 'projects') {
                    store.projects.forEach(p => {
                        const tasks = p.tasks || [];
                        const doneCount = tasks.filter(t => t.done).length;
                        const progress = tasks.length > 0 ? Math.round((doneCount / tasks.length) * 100) : 0;

                        html += `
                            <div class="bg-white rounded-2xl p-4 shadow-sm mb-3 border border-sage-100">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-sage-100 text-sage-700">${p.type}</span>
                                        <h3 class="font-bold text-slateDark mt-1 text-base">${p.name}</h3>
                                    </div>
                                    <div class="flex gap-2 text-gray-400">
                                        <button onclick="openModal('project', ${p.id})" class="hover:text-sage-600"><i class="fa-solid fa-pen text-xs"></i></button>
                                        <button onclick="deleteProject(${p.id})" class="hover:text-red-400"><i class="fa-solid fa-trash text-xs"></i></button>
                                        <button onclick="toggleProjectCollapse(${p.id})" class="hover:text-slateDark"><i class="fa-solid fa-chevron-${p.collapsed ? 'down' : 'up'} text-xs"></i></button>
                                    </div>
                                </div>
                                <div class="text-xs text-gray-500 mb-2">Số tiền: <span class="font-semibold text-slateDark">${p.amount ? p.amount.toLocaleString() : '0'} VNĐ</span></div>

                                <div class="w-full bg-gray-100 h-2 rounded-full mb-3 overflow-hidden">
                                    <div class="bg-sage-500 h-2 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
                                </div>

                                ${!p.collapsed ? `
                                    <div class="space-y-2 border-t border-gray-50 pt-3">
                                        ${tasks.map(t => `
                                            <div class="flex items-center justify-between text-xs bg-cream p-2 rounded-xl">
                                                <div class="flex items-center gap-2 cursor-pointer" onclick="toggleProjectTask(${p.id}, ${t.id})">
                                                    <i class="fa-${t.done ? 'solid fa-circle-check text-sage-500' : 'regular fa-circle text-gray-300'} text-base"></i>
                                                    <span class="${t.done ? 'line-through text-gray-400' : 'text-slateDark'}">${t.text}</span>
                                                </div>
                                                <button onclick="deleteProjectTask(${p.id}, ${t.id})" class="text-gray-300 hover:text-red-400"><i class="fa-solid fa-xmark"></i></button>
                                            </div>
                                        `).join('')}
                                        <div class="flex gap-2 mt-2">
                                            <input id="inp-new-task-${p.id}" type="text" placeholder="Thêm việc..." class="flex-1 text-xs p-2 border border-sage-100 rounded-xl focus:outline-none focus:border-sage-500">
                                            <button onclick="addProjectTask(${p.id})" class="bg-warmYellow-400 hover:bg-warmYellow-500 text-slateDark px-3 py-1 rounded-xl text-xs font-bold transition">Thêm</button>
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    });
                } else {
                    store.singleTasks.forEach(t => {
                        html += `
                            <div class="bg-white rounded-2xl p-3.5 shadow-sm mb-2.5 border border-sage-100 flex items-center justify-between">
                                <div class="flex items-center gap-3 cursor-pointer" onclick="toggleSingleTask(${t.id})">
                                    <i class="fa-${t.done ? 'solid fa-circle-check text-sage-500' : 'regular fa-circle text-gray-300'} text-lg"></i>
                                    <div>
                                        <p class="text-xs font-semibold ${t.done ? 'line-through text-gray-400' : 'text-slateDark'}">${t.text}</p>
                                        <div class="flex gap-2 mt-1">
                                            ${t.priority === 'Gấp' ? `<span class="text-[9px] bg-warmYellow-400 text-slateDark font-bold px-1.5 py-0.5 rounded-md">GẤP</span>` : ''}
                                            ${t.dueDate ? `<span class="text-[10px] text-gray-400"><i class="fa-regular fa-clock text-[9px] mr-1"></i>${formatDate(t.dueDate)}</span>` : ''}
                                        </div>
                                    </div>
                                </div>
                                <div class="flex gap-2 text-gray-400">
                                    <button onclick="openModal('singleTask', ${t.id})" class="hover:text-sage-600"><i class="fa-solid fa-pen text-xs"></i></button>
                                    <button onclick="deleteSingleTask(${t.id})" class="hover:text-red-400"><i class="fa-solid fa-trash text-xs"></i></button>
                                </div>
                            </div>
                        `;
                    });
                }
                main.innerHTML = html;
            } else if (currentTab === 'finance') {
                title.innerText = 'Cá nhân';
                main.innerHTML = `<div class="bg-white p-4 rounded-2xl border border-sage-100 text-center text-xs text-gray-500">Khu vực quản lý thẻ & tài chính cá nhân</div>`;
            } else {
                title.innerText = 'Trang chủ';
                main.innerHTML = `<div class="bg-white p-4 rounded-2xl border border-sage-100 text-center text-xs text-gray-500">Tổng quan hoạt động</div>`;
            }
        }

        render();
    </script>
</body>
</html>
