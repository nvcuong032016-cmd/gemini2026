<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Cá Nhân & Công Việc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-0 sm:p-4">

    <!-- Mobile Frame -->
    <div class="w-full sm:max-w-md bg-white min-h-screen sm:min-h-[844px] sm:rounded-[36px] shadow-2xl flex flex-col justify-between overflow-hidden relative border-gray-200 border">

        <!-- Header -->
        <header class="px-5 pt-5 pb-3 bg-white flex justify-between items-center border-b border-gray-50">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-bars text-lg text-gray-700 cursor-pointer"></i>
                <h1 id="header-title" class="text-xl font-bold text-gray-900">Công việc</h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="clearCache()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-2 py-1 rounded-lg">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
                <button id="header-add-btn" onclick="handleHeaderAdd()" class="text-blue-600 text-2xl font-light hover:opacity-80">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 px-4 pt-2 overflow-y-auto hide-scrollbar pb-20">
            <!-- Content render -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bg-white border-t border-gray-100 flex justify-around py-3 absolute bottom-0 w-full z-10">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-gray-400">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Trang chủ</span>
            </button>
            <button onclick="switchTab('projects')" id="nav-projects" class="flex flex-col items-center text-blue-600">
                <i class="fa-solid fa-border-all text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Công việc</span>
            </button>
            <button onclick="switchTab('finance')" id="nav-finance" class="flex flex-col items-center text-gray-400">
                <i class="fa-regular fa-user text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Cá nhân</span>
            </button>
        </nav>
    </div>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl relative max-h-[90vh] overflow-y-auto hide-scrollbar">
            <h3 id="modal-title" class="font-bold text-lg text-gray-800 mb-4">Thêm mới</h3>
            <div id="modal-body" class="space-y-3"></div>
            <div class="flex justify-end gap-2 mt-5">
                <button onclick="closeModal()" class="px-4 py-2 text-xs font-bold text-gray-500 rounded-lg bg-gray-100">Hủy</button>
                <button id="modal-save-btn" class="px-4 py-2 text-xs font-bold text-white bg-blue-600 rounded-lg">Lưu lại</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-xs px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
        <i class="fa-solid fa-check text-green-400"></i>
        <span id="toast-msg">Đã chép nội dung</span>
    </div>

    <script>
        const STORAGE_KEY = 'my_unified_app_data_v2';

        function loadCombinedStore() {
            let store = {
                projects: [
                    { id: 1, name: 'DVCI Đà Lạt', amount: 50000000, startDate: '2026-08-01', note: 'Dự án dịch vụ công', type: 'DVCI', tasks: [
                        { id: 101, text: 'Khảo sát hiện trạng', done: true },
                        { id: 102, text: 'Lập hồ sơ kỹ thuật', done: true },
                        { id: 103, text: 'Triển khai hạ tầng', done: false }
                    ]},
                    { id: 2, name: 'Dự án B', amount: 20000000, startDate: '2026-08-05', note: 'Vé điện tử', type: 'G-Ticket', tasks: [
                        { id: 201, text: 'Tích hợp Gateway', done: true },
                        { id: 202, text: 'Kiểm thử ứng dụng', done: false }
                    ]}
                ],
                singleTasks: [
                    { id: 1, text: 'Nộp báo cáo công việc tuần', priority: 'Gấp', dueDate: '2026-08-20', done: false, note: '' }
                ],
                cards: [
                    { id: 1, bank: 'VPBank', cardType: 'Visa', limit: 50000000, days: '45 ngày', info: '', statementDate: '15', dueDate: '5' }
                ],
                loans: [],
                lends: []
            };

            let savedMain = localStorage.getItem(STORAGE_KEY);
            if (savedMain) {
                try { store = JSON.parse(savedMain); } catch(e){}
            }
            return store;
        }

        let store = loadCombinedStore();
        let currentTab = 'projects';
        let workSubTab = 'projects'; // 'projects' | 'single'

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        function clearCache() {
            if (confirm("Làm mới dữ liệu?")) {
                localStorage.clear();
                location.reload();
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('nav button').forEach(btn => btn.className = 'flex flex-col items-center text-gray-400');
            document.getElementById(`nav-${tab}`).className = 'flex flex-col items-center text-blue-600';
            render();
        }

        function switchWorkSubTab(sub) {
            workSubTab = sub;
            render();
        }

        function handleHeaderAdd() {
            if (currentTab === 'projects') {
                if (workSubTab === 'projects') openModal('project');
                else openModal('singleTask');
            } else if (currentTab === 'finance') {
                openModal('card');
            }
        }

        function formatNumberInput(input) {
            let val = input.value.replace(/,/g, '').replace(/\D/g, '');
            input.value = val ? Number(val).toLocaleString('en-US') : '';
        }

        function getRawNumber(value) {
            return parseFloat(String(value).replace(/,/g, '')) || 0;
        }

        function formatDate(dateStr) {
            if (!dateStr || !dateStr.includes('-')) return dateStr || '';
            const d = new Date(dateStr);
            return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
        }

        function validateFields(fieldIds) {
            let isValid = true;
            fieldIds.forEach(id => {
                const el = document.getElementById(id);
                if (el && !el.value.trim()) {
                    el.classList.add('border-red-500');
                    isValid = false;
                } else if (el) {
                    el.classList.remove('border-red-500');
                }
            });
            return isValid;
        }

        // --- HANDLERS DỰ ÁN & CÔNG VIỆC ---
        function toggleSingleTask(id) {
            const t = store.singleTasks.find(x => x.id === id);
            if (t) { t.done = !t.done; saveData(); render(); }
        }

        function deleteProject(id) {
            if (confirm('Bạn có chắc muốn xóa dự án này?')) {
                store.projects = store.projects.filter(p => p.id !== id);
                saveData(); render();
            }
        }

        function deleteSingleTask(id) {
            store.singleTasks = store.singleTasks.filter(t => t.id !== id);
            saveData(); render();
        }

        // --- MODALS ---
        function openModal(type, editId = null) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            const saveBtn = document.getElementById('modal-save-btn');

            modal.classList.remove('hidden');

            if (type === 'project') {
                const item = editId ? store.projects.find(p => p.id === editId) : null;
                title.innerText = item ? 'Sửa Dự Án' : 'Thêm Dự Án Mới';
                body.innerHTML = `
                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Tên dự án *</label>
                        <input id="inp-p-name" type="text" value="${item ? item.name : ''}" placeholder="Nhập tên dự án..." class="w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-gray-500 font-semibold mb-1 block">Loại dự án *</label>
                            <select id="inp-p-type" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm bg-white">
                                <option value="DVCI" ${item && item.type === 'DVCI' ? 'selected' : ''}>DVCI</option>
                                <option value="G-Ticket" ${item && item.type === 'G-Ticket' ? 'selected' : ''}>G-Ticket</option>
                                <option value="Khác" ${item && item.type === 'Khác' ? 'selected' : ''}>Khác</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 font-semibold mb-1 block">Số tiền (VNĐ)</label>
                            <input id="inp-p-amount" type="text" value="${item && item.amount ? item.amount.toLocaleString() : ''}" oninput="formatNumberInput(this)" placeholder="0" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Ngày bắt đầu</label>
                        <input id="inp-p-start" type="date" value="${item ? item.startDate : new Date().toISOString().split('T')[0]}" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Ghi chú</label>
                        <textarea id="inp-p-note" rows="2" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm" placeholder="Ghi chú chi tiết...">${item ? item.note || '' : ''}</textarea>
                    </div>
                `;
                saveBtn.onclick = () => {
                    if (!validateFields(['inp-p-name'])) return;
                    const data = {
                        id: editId || Date.now(),
                        name: document.getElementById('inp-p-name').value,
                        type: document.getElementById('inp-p-type').value,
                        amount: getRawNumber(document.getElementById('inp-p-amount').value),
                        startDate: document.getElementById('inp-p-start').value,
                        note: document.getElementById('inp-p-note').value,
                        tasks: item ? item.tasks : []
                    };
                    if (editId) {
                        const idx = store.projects.findIndex(p => p.id === editId);
                        store.projects[idx] = data;
                    } else {
                        store.projects.push(data);
                    }
                    saveData(); closeModal(); render();
                };
            } else if (type === 'singleTask') {
                const item = editId ? store.singleTasks.find(t => t.id === editId) : null;
                title.innerText = item ? 'Sửa Việc Riêng Lẻ' : 'Thêm Việc Riêng Lẻ';
                body.innerHTML = `
                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Nội dung công việc *</label>
                        <input id="inp-t-text" type="text" value="${item ? item.text : ''}" placeholder="Tên việc..." class="w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-gray-500 font-semibold mb-1 block">Độ ưu tiên</label>
                            <select id="inp-t-priority" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm bg-white">
                                <option value="Bình thường" ${item && item.priority === 'Bình thường' ? 'selected' : ''}>Bình thường</option>
                                <option value="Gấp" ${item && item.priority === 'Gấp' ? 'selected' : ''}>Gấp</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 font-semibold mb-1 block">Hạn chót</label>
                            <input id="inp-t-date" type="date" value="${item ? item.dueDate : ''}" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                        </div>
                    </div>
                `;
                saveBtn.onclick = () => {
                    if (!validateFields(['inp-t-text'])) return;
                    const data = {
                        id: editId || Date.now(),
                        text: document.getElementById('inp-t-text').value,
                        priority: document.getElementById('inp-t-priority').value,
                        dueDate: document.getElementById('inp-t-date').value,
                        done: item ? item.done : false
                    };
                    if (editId) {
                        const idx = store.singleTasks.findIndex(t => t.id === editId);
                        store.singleTasks[idx] = data;
                    } else {
                        store.singleTasks.push(data);
                    }
                    saveData(); closeModal(); render();
                };
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function render() {
            const main = document.getElementById('main-content');
            const title = document.getElementById('header-title');

            if (currentTab === 'home') {
                title.innerText = 'Trang Chủ';
                main.innerHTML = `<div class="p-4 text-center text-gray-500 text-sm">Trang chủ đang phát triển. Chuyển sang Tab Công việc hoặc Cá nhân để sử dụng.</div>`;
            } else if (currentTab === 'projects') {
                title.innerText = 'Công việc';
                
                // Mùa icon folder cho giao diện
                const folderColors = {
                    'DVCI': { bg: 'bg-blue-500', bar: 'bg-blue-500' },
                    'G-Ticket': { bg: 'bg-emerald-500', bar: 'bg-emerald-500' },
                    'Khác': { bg: 'bg-amber-500', bar: 'bg-amber-500' }
                };

                main.innerHTML = `
                    <!-- Sub Tabs: Dự án / Việc riêng lẻ -->
                    <div class="flex border-b border-gray-100 mb-4">
                        <button onclick="switchWorkSubTab('projects')" class="flex-1 py-2 text-center text-sm font-semibold relative ${workSubTab === 'projects' ? 'text-blue-600' : 'text-gray-400'}">
                            Dự án
                            ${workSubTab === 'projects' ? '<div class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600 rounded-full"></div>' : ''}
                        </button>
                        <button onclick="switchWorkSubTab('single')" class="flex-1 py-2 text-center text-sm font-semibold relative ${workSubTab === 'single' ? 'text-blue-600' : 'text-gray-400'}">
                            Việc riêng lẻ
                            ${workSubTab === 'single' ? '<div class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600 rounded-full"></div>' : ''}
                        </button>
                    </div>

                    ${workSubTab === 'projects' ? `
                        <div class="space-y-3">
                            ${store.projects.length === 0 ? '<p class="text-xs text-gray-400 text-center py-6">Chưa có dự án nào</p>' : ''}
                            ${store.projects.map(p => {
                                const total = p.tasks ? p.tasks.length : 0;
                                const doneCount = p.tasks ? p.tasks.filter(t => t.done).length : 0;
                                const percent = total > 0 ? Math.round((doneCount / total) * 100) : 0;
                                const theme = folderColors[p.type] || folderColors['Khác'];

                                return `
                                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                                    <div class="flex items-center justify-between mb-3">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 ${theme.bg} rounded-xl flex items-center justify-center text-white text-lg shadow-sm">
                                                <i class="fa-solid fa-folder"></i>
                                            </div>
                                            <div>
                                                <h4 class="font-bold text-gray-800 text-sm">${p.name}</h4>
                                                <span class="text-[11px] text-gray-400 font-medium">${doneCount}/${total} nhiệm vụ</span>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <button onclick="openModal('project', ${p.id})" class="text-gray-400 hover:text-blue-600 text-xs p-1"><i class="fa-solid fa-pen"></i></button>
                                            <button onclick="deleteProject(${p.id})" class="text-gray-400 hover:text-red-500 text-xs p-1"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                                        </div>
                                    </div>

                                    <!-- Progress bar UI chuẩn như ảnh mẫu -->
                                    <div class="flex items-center gap-3">
                                        <div class="flex-1 bg-gray-100 h-2 rounded-full overflow-hidden">
                                            <div class="${theme.bar} h-full rounded-full transition-all" style="width: ${percent}%"></div>
                                        </div>
                                        <span class="text-xs font-bold text-gray-600 min-w-[32px] text-right">${percent}%</span>
                                    </div>

                                    ${p.amount ? `<div class="mt-2 text-[11px] text-gray-500 font-medium">Ngân sách: <b class="text-blue-600">${p.amount.toLocaleString()} đ</b></div>` : ''}
                                </div>
                                `;
                            }).join('')}
                        </div>
                    ` : `
                        <!-- Tab Việc Riêng Lẻ -->
                        <div class="space-y-2">
                            ${store.singleTasks.length === 0 ? '<p class="text-xs text-gray-400 text-center py-6">Không có việc riêng lẻ nào</p>' : ''}
                            ${store.singleTasks.map(t => `
                                <div class="flex items-center justify-between p-3 bg-white rounded-xl border border-gray-100 shadow-sm">
                                    <label class="flex items-center gap-2.5 cursor-pointer flex-1">
                                        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleSingleTask(${t.id})" class="rounded text-blue-600 w-4 h-4">
                                        <span class="text-xs font-medium ${t.done ? 'line-through text-gray-400' : 'text-gray-800'}">${t.text}</span>
                                    </label>
                                    <button onclick="deleteSingleTask(${t.id})" class="text-gray-400 hover:text-red-500 text-xs px-2 py-1"><i class="fa-regular fa-trash-can"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    `}
                `;
            } else if (currentTab === 'finance') {
                title.innerText = 'Cá nhân';
                main.innerHTML = `<div class="p-4 text-center text-gray-500 text-sm">Đã bảo lưu toàn bộ dữ liệu tab Cá nhân.</div>`;
            }
        }

        switchTab('projects');
    </script>
</body>
</html>
