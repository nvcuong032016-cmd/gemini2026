<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Cá Nhân</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-0 sm:p-4">

    <!-- Mobile Frame -->
    <div class="w-full sm:max-w-md bg-slate-50 min-h-screen sm:min-h-[844px] sm:rounded-[36px] shadow-2xl flex flex-col justify-between overflow-hidden relative border-gray-200 border">

        <!-- Header -->
        <header class="p-5 bg-white flex justify-between items-center border-b border-gray-100">
            <h1 id="header-title" class="text-xl font-bold text-gray-800">Trang chủ</h1>
            <button onclick="clearCache()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-2.5 py-1.5 rounded-lg font-medium">
                <i class="fa-solid fa-arrows-rotate mr-1"></i> Làm mới
            </button>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 p-4 overflow-y-auto hide-scrollbar pb-20">
            <!-- Content render -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bg-white border-t border-gray-100 flex justify-around py-3 absolute bottom-0 w-full z-10">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-blue-600">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-xs mt-1 font-medium">Trang chủ</span>
            </button>
            <button onclick="switchTab('projects')" id="nav-projects" class="flex flex-col items-center text-gray-400">
                <i class="fa-solid fa-list-check text-lg"></i>
                <span class="text-xs mt-1 font-medium">Công việc</span>
            </button>
            <button onclick="switchTab('finance')" id="nav-finance" class="flex flex-col items-center text-gray-400">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-xs mt-1 font-medium">Cá nhân</span>
            </button>
        </nav>
    </div>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl relative max-h-[90vh] overflow-y-auto hide-scrollbar">
            <h3 id="modal-title" class="font-bold text-lg text-gray-800 mb-4">Thêm mới</h3>
            <div id="modal-body" class="space-y-3"></div>
            <div class="flex justify-end gap-2 mt-5">
                <button onclick="closeModal()" class="px-4 py-2 text-xs font-bold text-gray-500 rounded-lg bg-gray-100">Hủy</button>
                <button id="modal-save-btn" class="px-4 py-2 text-xs font-bold text-white bg-blue-600 rounded-lg">Lưu lại</button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        let store = JSON.parse(localStorage.getItem('my_app_data_v6')) || {
            projects: [
                {
                    id: 1, name: 'DVCI Đà Lạt', startDate: '2026-08-01', note: 'Dự án trọng điểm.',
                    tasks: [
                        { id: 101, title: 'Chuẩn bị hồ sơ', date: '2026-08-10', done: true },
                        { id: 102, title: 'Kiểm tra dự toán', date: '2026-08-11', done: true }
                    ]
                }
            ],
            cards: [
                { id: 1, bank: 'VPBank', cardType: 'Visa', limit: 50000000, days: '45 ngày', info: 'Ghi chú thẻ...', statementDate: '15', dueDate: '5' }
            ],
            loans: [
                { id: 1, bank: 'VPBank', name: 'Khoản vay mua xe', totalAmount: 24000000, monthlyPay: 2000000, startDate: '2026-01-10', months: 12, paidMonths: [1, 2, 3] }
            ],
            lends: [
                { id: 1, borrower: 'Nguyễn Văn A', amount: 10000000, startDate: '2026-08-01', note: 'Cho vay ngắn hạn', completed: false }
            ]
        };

        let currentTab = 'home';
        let activeProjectId = null;

        function saveData() {
            localStorage.setItem('my_app_data_v6', JSON.stringify(store));
        }

        function clearCache() {
            if (confirm("Reset ứng dụng để cập nhật lại cấu trúc dữ liệu mới nhất?")) {
                localStorage.removeItem('my_app_data');
                localStorage.removeItem('my_app_data_v2');
                localStorage.removeItem('my_app_data_v3');
                localStorage.removeItem('my_app_data_v4');
                localStorage.removeItem('my_app_data_v5');
                localStorage.removeItem('my_app_data_v6');
                location.reload();
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            activeProjectId = null;
            document.querySelectorAll('nav button').forEach(btn => btn.className = 'flex flex-col items-center text-gray-400');
            document.getElementById(`nav-${tab}`).className = 'flex flex-col items-center text-blue-600';
            render();
        }

        function formatNumberInput(input) {
            let val = input.value.replace(/,/g, '').replace(/\D/g, '');
            if (val) {
                input.value = Number(val).toLocaleString('en-US');
            } else {
                input.value = '';
            }
        }

        function getRawNumber(value) {
            return parseFloat(value.replace(/,/g, '')) || 0;
        }

        function renderDayOptions() {
            let opts = `<option value="">Chọn ngày</option>`;
            for (let i = 1; i <= 31; i++) {
                opts += `<option value="${i}">Ngày ${i}</option>`;
            }
            return opts;
        }

        function calcMonthly() {
            const total = getRawNumber(document.getElementById('inp-amount').value);
            const months = parseInt(document.getElementById('inp-months').value) || 12;
            if (total > 0) {
                const monthly = Math.round(total / months);
                document.getElementById('inp-monthly').value = monthly.toLocaleString('en-US');
            }
        }

        function clearValidationErrors() {
            document.querySelectorAll('.required-field').forEach(el => {
                el.classList.remove('border-red-500');
                el.classList.add('border-gray-200');
            });
        }

        function validateFields(fieldIds) {
            clearValidationErrors();
            let isValid = true;
            fieldIds.forEach(id => {
                const el = document.getElementById(id);
                if (el && !el.value.trim()) {
                    el.classList.remove('border-gray-200');
                    el.classList.add('border-red-500');
                    isValid = false;
                }
            });
            return isValid;
        }

        function calculateDaysFrom(startDateStr) {
            if (!startDateStr) return 0;
            const start = new Date(startDateStr);
            const today = new Date();
            start.setHours(0,0,0,0);
            today.setHours(0,0,0,0);
            const diffTime = today - start;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays >= 0 ? diffDays : 0;
        }

        function openModal(type, projId = null) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            const saveBtn = document.getElementById('modal-save-btn');

            modal.classList.remove('hidden');

            if (type === 'project') {
                title.innerText = 'Thêm Dự Án Mới';
                body.innerHTML = `
                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Tên dự án *</label>
                        <input id="inp-name" type="text" placeholder="Nhập tên dự án" class="required-field w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Ngày bắt đầu</label>
                        <input id="inp-start" type="date" value="${new Date().toISOString().split('T')[0]}" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                    </div>
                `;
                saveBtn.onclick = () => {
                    if (!validateFields(['inp-name'])) return;
                    const name = document.getElementById('inp-name').value;
                    const startDate = document.getElementById('inp-start').value;
                    store.projects.push({ id: Date.now(), name, startDate, note: '', tasks: [] });
                    saveData(); closeModal(); render();
                };
            } else if (type === 'card') {
                title.innerText = 'Thêm Thẻ Tín Dụng';
                body.innerHTML = `
                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Tên ngân hàng *</label>
                        <input id="inp-bank" type="text" placeholder="Tên ngân hàng (VPBank, MB...)" class="required-field w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-gray-500 font-semibold mb-1 block">Loại thẻ</label>
                            <select id="inp-card-type" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm bg-white">
                                <option value="Visa">Visa</option>
                                <option value="JCB">JCB</option>
                                <option value="Mastercard">Mastercard</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 font-semibold mb-1 block">Thời hạn thanh toán</label>
                            <select id="inp-days" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm bg-white">
                                <option value="45 ngày">45 ngày</option>
                                <option value="55 ngày">55 ngày</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Hạn mức thẻ (VNĐ) *</label>
                        <input id="inp-limit" type="text" oninput="formatNumberInput(this)" placeholder="Ví dụ: 50,000,000" class="required-field w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                    </div>

                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Ghi chú</label>
                        <textarea id="inp-info" rows="2" placeholder="Ghi chú (có thể xuống dòng)..." class="w-full p-2.5 border border-gray-200 rounded-lg text-sm"></textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-gray-500 font-semibold mb-1 block">Ngày sao kê *</label>
                            <select id="inp-statement" class="required-field w-full p-2.5 border border-gray-200 rounded-lg text-sm bg-white">
                                ${renderDayOptions()}
                            </select>
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 font-semibold mb-1 block">Hạn thanh toán *</label>
                            <select id="inp-due" class="required-field w-full p-2.5 border border-gray-200 rounded-lg text-sm bg-white">
                                ${renderDayOptions()}
                            </select>
                        </div>
                    </div>
                `;
                saveBtn.onclick = () => {
                    if (!validateFields(['inp-bank', 'inp-limit', 'inp-statement', 'inp-due'])) return;
                    
                    const bank = document.getElementById('inp-bank').value;
                    const cardType = document.getElementById('inp-card-type').value;
                    const days = document.getElementById('inp-days').value;
                    const limit = getRawNumber(document.getElementById('inp-limit').value);
                    const info = document.getElementById('inp-info').value;
                    const statementDate = document.getElementById('inp-statement').value;
                    const dueDate = document.getElementById('inp-due').value;

                    store.cards.push({ id: Date.now(), bank, cardType, days, limit, info, statementDate, dueDate });
                    saveData(); closeModal(); render();
                };
            } else if (type === 'loan') {
                title.innerText = 'Thêm Khoản Vay / Trả Góp';
                body.innerHTML = `
                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Ngân hàng / Đơn vị cho vay *</label>
                        <input id="inp-bank" type="text" placeholder="VPBank, FE Credit..." class="required-field w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Tên khoản vay / Món đồ *</label>
                        <input id="inp-name" type="text" placeholder="Mua xe, Mua điện thoại..." class="required-field w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Tổng số tiền (VNĐ) *</label>
                        <input id="inp-amount" type="text" oninput="formatNumberInput(this); calcMonthly();" placeholder="Ví dụ: 24,000,000" class="required-field w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-gray-500 font-semibold mb-1 block">Kỳ hạn vay</label>
                            <select id="inp-months" onchange="calcMonthly()" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm bg-white">
                                <option value="3">3 tháng</option>
                                <option value="6">6 tháng</option>
                                <option value="12" selected>12 tháng</option>
                                <option value="24">24 tháng</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 font-semibold mb-1 block">Trả hàng tháng (VNĐ) *</label>
                            <input id="inp-monthly" type="text" oninput="formatNumberInput(this)" placeholder="Số tiền/tháng" class="required-field w-full p-2.5 border border-gray-200 rounded-lg text-sm bg-gray-50">
                        </div>
                    </div>

                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Ngày bắt đầu vay</label>
                        <input id="inp-start" type="date" value="${new Date().toISOString().split('T')[0]}" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                    </div>
                `;
                saveBtn.onclick = () => {
                    if (!validateFields(['inp-bank', 'inp-name', 'inp-amount', 'inp-monthly'])) return;

                    const bank = document.getElementById('inp-bank').value;
                    const name = document.getElementById('inp-name').value;
                    const totalAmount = getRawNumber(document.getElementById('inp-amount').value);
                    const monthlyPay = getRawNumber(document.getElementById('inp-monthly').value);
                    const startDate = document.getElementById('inp-start').value;
                    const months = parseInt(document.getElementById('inp-months').value);

                    store.loans.push({ id: Date.now(), bank, name, totalAmount, monthlyPay, startDate, months, paidMonths: [] });
                    saveData(); closeModal(); render();
                };
            } else if (type === 'lend') {
                title.innerText = 'Thêm Khoản Tiền Gửi / Cho Vay';
                body.innerHTML = `
                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Nơi / Người vay tiền *</label>
                        <input id="inp-borrower" type="text" placeholder="Tên cá nhân, ngân hàng, quỹ..." class="required-field w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Số tiền (VNĐ) *</label>
                        <input id="inp-amount" type="text" oninput="formatNumberInput(this)" placeholder="Ví dụ: 10,000,000" class="required-field w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Ngày bắt đầu *</label>
                        <input id="inp-start" type="date" value="${new Date().toISOString().split('T')[0]}" class="required-field w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Ghi chú</label>
                        <textarea id="inp-note" rows="2" placeholder="Nội dung ghi chú..." class="w-full p-2.5 border border-gray-200 rounded-lg text-sm"></textarea>
                    </div>
                `;
                saveBtn.onclick = () => {
                    if (!validateFields(['inp-borrower', 'inp-amount', 'inp-start'])) return;

                    const borrower = document.getElementById('inp-borrower').value;
                    const amount = getRawNumber(document.getElementById('inp-amount').value);
                    const startDate = document.getElementById('inp-start').value;
                    const note = document.getElementById('inp-note').value;

                    if (!Array.isArray(store.lends)) store.lends = [];
                    store.lends.push({ id: Date.now(), borrower, amount, startDate, note, completed: false });
                    saveData(); closeModal(); render();
                };
            } else if (type === 'task') {
                title.innerText = 'Thêm Nhiệm Vụ';
                body.innerHTML = `
                    <div>
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Nhiệm vụ *</label>
                        <input id="inp-title" type="text" placeholder="Tên nhiệm vụ" class="required-field w-full p-2.5 border border-gray-200 rounded-lg text-sm">
                    </div>
                `;
                saveBtn.onclick = () => {
                    if (!validateFields(['inp-title'])) return;
                    const titleVal = document.getElementById('inp-title').value;
                    const proj = store.projects.find(p => p.id === projId);
                    proj.tasks.push({ id: Date.now(), title: titleVal, date: new Date().toISOString().split('T')[0], done: false });
                    saveData(); closeModal(); render();
                };
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function toggleLendStatus(lendId) {
            if (!Array.isArray(store.lends)) return;
            const lend = store.lends.find(l => l.id === lendId);
            if (lend) {
                lend.completed = !lend.completed;
                saveData();
                render();
            }
        }

        function toggleLoanMonth(loanId, monthIndex) {
            const loan = store.loans.find(l => l.id === loanId);
            if (loan) {
                if (!Array.isArray(loan.paidMonths)) loan.paidMonths = [];
                const idx = loan.paidMonths.indexOf(monthIndex);
                if (idx > -1) {
                    loan.paidMonths.splice(idx, 1);
                } else {
                    loan.paidMonths.push(monthIndex);
                }
                saveData();
                render();
            }
        }

        function toggleTask(projId, taskId) {
            const proj = store.projects.find(p => p.id === projId);
            if (proj) {
                const task = proj.tasks.find(t => t.id === taskId);
                if (task) task.done = !task.done;
                saveData(); render();
            }
        }

        function saveProjectNote(projId) {
            const noteText = document.getElementById(`proj-note-${projId}`).value;
            const proj = store.projects.find(p => p.id === projId);
            if (proj) {
                proj.note = noteText;
                saveData();
                alert('Đã lưu ghi chú!');
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'Chưa chọn';
            if (!dateStr.includes('-')) return dateStr;
            const d = new Date(dateStr);
            return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
        }

        function render() {
            const main = document.getElementById('main-content');
            const title = document.getElementById('header-title');

            if (!Array.isArray(store.lends)) store.lends = [];

            if (activeProjectId) {
                renderProjectDetail(activeProjectId);
                return;
            }

            if (currentTab === 'home') {
                title.innerText = 'Trang chủ';
                main.innerHTML = `
                    <div class="mb-4">
                        <span class="text-xs text-gray-500 font-medium">Hôm nay</span>
                        <h2 class="text-lg font-bold text-gray-800">Thứ Ba, 18/08/2026</h2>
                    </div>

                    <div class="mb-6">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-gray-700">Dự án & Công việc</h3>
                            <button onclick="openModal('project')" class="text-blue-600 text-sm font-semibold">+ Thêm</button>
                        </div>
                        ${renderProjectCards()}
                    </div>

                    <div>
                        <h3 class="font-bold text-gray-700 mb-3">Tài chính cá nhân</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <div onclick="switchTab('finance')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 cursor-pointer">
                                <i class="fa-solid fa-credit-card text-blue-500 text-xl mb-2"></i>
                                <div class="font-semibold text-sm">Thẻ tín dụng</div>
                                <div class="text-xs text-gray-500 mt-1">${store.cards.length} thẻ</div>
                            </div>
                            <div onclick="switchTab('finance')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 cursor-pointer">
                                <i class="fa-solid fa-hand-holding-dollar text-emerald-500 text-xl mb-2"></i>
                                <div class="font-semibold text-sm">Tiền gửi / Cho vay</div>
                                <div class="text-xs text-gray-500 mt-1">${store.lends.length} khoản</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'projects') {
                title.innerText = 'Công việc';
                main.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-gray-800 text-lg">Danh sách dự án</h2>
                        <button onclick="openModal('project')" class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold shadow-md">+</button>
                    </div>
                    ${renderProjectCards()}
                `;
            } else if (currentTab === 'finance') {
                title.innerText = 'Tài chính Cá nhân';
                main.innerHTML = `
                    <!-- Tiền gửi / Cho vay -->
                    <div class="mb-6">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-gray-800 text-base">Tiền gửi / Cho vay</h3>
                            <button onclick="openModal('lend')" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm">+ Thêm khoản gửi</button>
                        </div>
                        ${store.lends.length === 0 ? '<p class="text-xs text-gray-400 italic">Chưa có khoản gửi/cho vay nào</p>' : ''}
                        ${store.lends.map(l => {
                            const daysCount = calculateDaysFrom(l.startDate);
                            return `
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-3 ${l.completed ? 'opacity-60 bg-gray-50' : ''}">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <div class="font-bold text-gray-800 text-base flex items-center gap-2">
                                            ${l.borrower}
                                            ${l.completed ? '<span class="text-[10px] bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded">Đã thu hồi</span>' : ''}
                                        </div>
                                        <div class="text-xs text-gray-400 mt-0.5">Ngày bắt đầu: <b>${formatDate(l.startDate)}</b></div>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-[10px] text-gray-400 font-bold uppercase block">Số tiền</span>
                                        <span class="font-bold text-emerald-600 text-sm">${(l.amount || 0).toLocaleString()} đ</span>
                                    </div>
                                </div>

                                <div class="flex justify-between items-center bg-emerald-50/60 p-2.5 rounded-lg my-2 border border-emerald-100/50 text-xs">
                                    <span class="text-gray-600 font-medium">Số ngày cho vay:</span>
                                    <span class="font-bold text-emerald-700 text-sm">${daysCount} ngày</span>
                                </div>

                                ${l.note ? `<p class="text-xs text-gray-600 bg-gray-50 p-2 rounded-lg whitespace-pre-line my-2 border border-gray-100">${l.note}</p>` : ''}

                                <div class="mt-3 text-right">
                                    <button onclick="toggleLendStatus(${l.id})" class="px-3 py-1.5 text-xs font-bold rounded-lg transition ${l.completed ? 'bg-gray-200 text-gray-700' : 'bg-emerald-600 text-white hover:bg-emerald-700'}">
                                        <i class="fa-solid ${l.completed ? 'fa-rotate-left' : 'fa-check'} mr-1"></i>
                                        ${l.completed ? 'Đánh dấu chưa lấy tiền' : 'Hoàn thành (Đã lấy lại tiền)'}
                                    </button>
                                </div>
                            </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- Thẻ tín dụng -->
                    <div class="mb-6">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-gray-800 text-base">Thẻ tín dụng ngân hàng</h3>
                            <button onclick="openModal('card')" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm">+ Thêm thẻ</button>
                        </div>
                        ${store.cards.length === 0 ? '<p class="text-xs text-gray-400 italic">Chưa có thẻ nào</p>' : ''}
                        ${store.cards.map(c => `
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-3">
                                <div class="flex justify-between items-start mb-1">
                                    <div>
                                        <div class="font-bold text-gray-800 text-base">${c.bank}</div>
                                        <div class="flex items-center gap-2 mt-0.5">
                                            <span class="text-[10px] bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded">${c.cardType || 'Visa'}</span>
                                            <span class="text-[10px] bg-gray-100 text-gray-600 font-medium px-2 py-0.5 rounded">${c.days || '45 ngày'}</span>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-[10px] text-gray-400 font-bold uppercase block">Hạn mức</span>
                                        <span class="font-bold text-blue-600 text-sm">${(c.limit || 0).toLocaleString()} đ</span>
                                    </div>
                                </div>
                                ${c.info ? `<p class="text-xs text-gray-600 bg-gray-50 p-2 rounded-lg whitespace-pre-line my-2.5 border border-gray-100">${c.info}</p>` : ''}
                                <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 p-2.5 rounded-lg mt-2">
                                    <div>
                                        <span class="text-gray-400 block text-[10px] uppercase font-bold">Ngày sao kê</span>
                                        <b class="text-gray-700">Ngày ${c.statementDate} hàng tháng</b>
                                    </div>
                                    <div>
                                        <span class="text-gray-400 block text-[10px] uppercase font-bold">Hạn thanh toán</span>
                                        <b class="text-red-500">Ngày ${c.dueDate} hàng tháng</b>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Trả góp -->
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-gray-800 text-base">Khoản vay / Trả góp</h3>
                            <button onclick="openModal('loan')" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm">+ Thêm khoản vay</button>
                        </div>
                        ${store.loans.length === 0 ? '<p class="text-xs text-gray-400 italic">Chưa có khoản vay nào</p>' : ''}
                        ${store.loans.map(l => {
                            if (!Array.isArray(l.paidMonths)) l.paidMonths = [];
                            const monthlyPay = l.monthlyPay || Math.round(l.totalAmount / l.months);
                            const paidCount = l.paidMonths.length;
                            const percent = Math.round((paidCount / l.months) * 100);

                            return `
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <div class="font-bold text-gray-800 text-base">${l.name}</div>
                                        <div class="text-xs text-blue-600 font-semibold">${l.bank}</div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-[10px] text-gray-400 font-bold uppercase">Tổng vay</div>
                                        <div class="font-bold text-gray-800 text-sm">${l.totalAmount.toLocaleString()} đ</div>
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-2 text-xs bg-blue-50/50 p-2.5 rounded-lg my-3 border border-blue-100/50">
                                    <div>
                                        <span class="text-gray-500 block text-[10px]">Ngày bắt đầu:</span>
                                        <b>${formatDate(l.startDate)}</b>
                                    </div>
                                    <div>
                                        <span class="text-gray-500 block text-[10px]">Trả hàng tháng:</span>
                                        <b class="text-blue-700">${monthlyPay.toLocaleString()} đ</b>
                                    </div>
                                </div>

                                <div class="flex justify-between items-center text-xs mb-1.5">
                                    <span class="text-gray-500">Tiến độ: <b>${paidCount}/${l.months} kỳ</b></span>
                                    <span class="font-bold text-green-600">${percent}%</span>
                                </div>
                                <div class="w-full bg-gray-100 rounded-full h-2 mb-3">
                                    <div class="bg-green-500 h-2 rounded-full transition-all" style="width: ${percent}%"></div>
                                </div>

                                <details class="border-t border-gray-100 pt-2 group">
                                    <summary class="flex justify-between items-center cursor-pointer text-xs font-bold text-gray-700 py-1 select-none">
                                        <span>Chi tiết kỳ thanh toán</span>
                                        <i class="fa-solid fa-chevron-down text-gray-400 group-open:rotate-180 transition-transform text-xs"></i>
                                    </summary>
                                    <div class="grid grid-cols-3 gap-2 mt-2 pt-1">
                                        ${Array.from({ length: l.months }, (_, i) => i + 1).map(m => {
                                            const isChecked = l.paidMonths.includes(m);
                                            return `
                                                <button onclick="toggleLoanMonth(${l.id}, ${m})" class="flex items-center justify-between p-2 rounded-lg text-[11px] font-medium border ${isChecked ? 'bg-green-50 border-green-200 text-green-700' : 'bg-gray-50 border-gray-100 text-gray-500'}">
                                                    <span>Kỳ ${m}/${l.months}</span>
                                                    <i class="fa-solid ${isChecked ? 'fa-circle-check text-green-600' : 'fa-circle-thin text-gray-300'} text-xs"></i>
                                                </button>
                                            `;
                                        }).join('')}
                                    </div>
                                </details>
                            </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }
        }

        function renderProjectCards() {
            return store.projects.map(p => {
                const total = p.tasks.length;
                const done = p.tasks.filter(t => t.done).length;
                const percent = total > 0 ? Math.round((done / total) * 100) : 0;
                
                return `
                    <div onclick="openProject(${p.id})" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-3 cursor-pointer">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center font-bold">
                                    <i class="fa-solid fa-folder text-lg"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-gray-800">${p.name}</h4>
                                    <div class="text-[11px] text-gray-400">Bắt đầu: ${formatDate(p.startDate)}</div>
                                </div>
                            </div>
                            <span class="text-xs font-bold text-gray-500">${percent}%</span>
                        </div>
                        <div class="flex justify-between text-xs text-gray-400 mt-2 mb-1">
                            <span>Nhiệm vụ</span>
                            <span>${done}/${total}</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-1.5">
                            <div class="bg-blue-600 h-1.5 rounded-full" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openProject(id) {
            activeProjectId = id;
            render();
        }

        function renderProjectDetail(id) {
            const p = store.projects.find(proj => proj.id === id);
            const title = document.getElementById('header-title');
            title.innerText = p.name;

            const total = p.tasks.length;
            const done = p.tasks.filter(t => t.done).length;
            const percent = total > 0 ? Math.round((done / total) * 100) : 0;

            const main = document.getElementById('main-content');
            main.innerHTML = `
                <button onclick="activeProjectId=null; render()" class="text-sm text-blue-600 mb-3 flex items-center gap-1 font-medium">
                    <i class="fa-solid fa-arrow-left"></i> Quay lại
                </button>

                <div class="bg-blue-600 text-white p-5 rounded-2xl mb-4 shadow-lg">
                    <h2 class="text-xl font-bold mb-1">${p.name}</h2>
                    <p class="text-xs opacity-80 mb-3">Ngày bắt đầu: ${formatDate(p.startDate)}</p>
                    <div class="flex items-center justify-between gap-4">
                        <div class="w-full bg-blue-400 rounded-full h-2">
                            <div class="bg-white h-2 rounded-full" style="width: ${percent}%"></div>
                        </div>
                        <span class="text-lg font-bold">${percent}%</span>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-xl border border-gray-100 mb-5">
                    <h4 class="font-bold text-gray-700 text-xs uppercase mb-2"><i class="fa-regular fa-note-sticky mr-1"></i> Ghi chú dự án</h4>
                    <textarea id="proj-note-${p.id}" rows="3" class="w-full p-2.5 border border-gray-200 rounded-lg text-xs text-gray-700 focus:outline-none focus:border-blue-500" placeholder="Nhập quy định, đặc thù riêng cho dự án này...">${p.note || ''}</textarea>
                    <button onclick="saveProjectNote(${p.id})" class="mt-2 text-xs bg-gray-800 text-white px-3 py-1.5 rounded-lg font-semibold hover:bg-black transition">Lưu ghi chú</button>
                </div>

                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-gray-700">Danh sách nhiệm vụ</h3>
                    <button onclick="openModal('task', ${p.id})" class="text-blue-600 text-sm font-semibold">+ Thêm nhiệm vụ</button>
                </div>

                <div class="space-y-2">
                    ${p.tasks.map((t, idx) => `
                        <div class="bg-white p-3 rounded-xl border border-gray-100 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <span class="text-xs text-gray-400 font-bold w-4">${idx + 1}</span>
                                <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${p.id}, ${t.id})" class="w-5 h-5 accent-blue-600 rounded cursor-pointer">
                                <span class="text-sm ${t.done ? 'line-through text-gray-400' : 'text-gray-800 font-medium'}">${t.title}</span>
                            </div>
                            <span class="text-[11px] text-gray-400"><i class="fa-regular fa-calendar mr-1"></i>${formatDate(t.date)}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
