      Công việc
    </button>
    <button class="nav-item" onclick="switchTab('tab-tai-chinh', this)">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      Thẻ & Tài chính
    </button>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // --- 1. GLOBAL STATE & TAB NAVIGATION ---
    let currentFinanceTab = 'credit'; // 'credit', 'saving', 'loan'
    let currentWorkSegment = 'project'; // 'project', 'single'

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.bottom-nav .nav-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
      
      if (tabId === 'tab-trang-chu') {
        updateDashboardStats();
      }
    }

    function switchWorkSegment(type) {
      currentWorkSegment = type;
      const btnProj = document.getElementById('btn-work-project');
      const btnSingle = document.getElementById('btn-work-single');
      const listProj = document.getElementById('work-project-list');
      const listSingle = document.getElementById('work-single-list');

      if (type === 'project') {
        btnProj.classList.add('active');
        btnSingle.classList.remove('active');
        listProj.style.display = 'block';
        listSingle.style.display = 'none';
      } else {
        btnSingle.classList.add('active');
        btnProj.classList.remove('active');
        listSingle.style.display = 'block';
        listProj.style.display = 'none';
      }
    }

    function switchFinanceTab(tab) {
      currentFinanceTab = tab;
      ['credit', 'saving', 'loan'].forEach(t => {
        const btn = document.getElementById(`btn-tab-${t}`);
        const list = document.getElementById(`list-${t}`);
        if (t === tab) {
          btn.classList.add('active');
          list.style.display = 'block';
        } else {
          btn.classList.remove('active');
          list.style.display = 'none';
        }
      });
    }

    // --- 2. MODAL CONTROLS ---
    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    function openAddWorkModal() {
      if (currentWorkSegment === 'project') {
        document.getElementById('modal-project-title').textContent = 'Thêm Dự Án Mới';
        document.getElementById('edit-project-id').value = '';
        document.getElementById('project-name').value = '';
        document.getElementById('project-start-date').value = '';
        document.getElementById('project-end-date').value = '';
        document.getElementById('project-type').value = 'DVCI';
        document.getElementById('project-budget').value = '';
        document.getElementById('project-note').value = '';
        document.getElementById('modal-du-an').classList.add('active');
      } else {
        document.getElementById('modal-single-title').textContent = 'Thêm Việc Riêng Lẻ';
        document.getElementById('edit-single-id').value = '';
        document.getElementById('single-work-name').value = '';
        document.getElementById('single-work-start-date').value = '';
        document.getElementById('single-work-note').value = '';
        document.getElementById('modal-viec-rieng-le').classList.add('active');
      }
    }

    function openAddFinanceModal() {
      document.getElementById('edit-finance-id').value = '';
      document.getElementById('fin-name').value = '';
      document.getElementById('fin-note').value = '';

      const fieldsCredit = document.getElementById('fields-credit');
      const fieldsSaving = document.getElementById('fields-saving');
      const fieldsLoan = document.getElementById('fields-loan');
      const title = document.getElementById('modal-finance-title');
      const lblBank = document.getElementById('lbl-bank-name');

      fieldsCredit.style.display = 'none';
      fieldsSaving.style.display = 'none';
      fieldsLoan.style.display = 'none';

      if (currentFinanceTab === 'credit') {
        title.textContent = 'Thêm Thẻ Tín Dụng';
        lblBank.textContent = 'Tên ngân hàng *';
        fieldsCredit.style.display = 'block';
        document.getElementById('fin-card-type').value = 'VISA';
        document.getElementById('fin-grace-period').value = '45 ngày';
        document.getElementById('fin-credit-limit').value = '';
        document.getElementById('fin-statement-date').value = '';
        document.getElementById('fin-due-date').value = '';
      } else if (currentFinanceTab === 'saving') {
        title.textContent = 'Thêm Khoản Gửi / Cho Vay';
        lblBank.textContent = 'Tên ngân hàng / Người mượn *';
        fieldsSaving.style.display = 'block';
        document.getElementById('fin-saving-category').value = 'Tiết kiệm';
        document.getElementById('fin-customer-type').value = 'Cá nhân';
        document.getElementById('fin-saving-amount').value = '';
        document.getElementById('fin-saving-term').value = 'Không kỳ hạn';
      } else {
        title.textContent = 'Thêm Khoản Vay / Trả Góp';
        lblBank.textContent = 'Tên khoản vay / Thiết bị *';
        fieldsLoan.style.display = 'block';
        document.getElementById('fin-loan-amount').value = '';
        document.getElementById('fin-loan-term').value = '12';
        document.getElementById('fin-loan-monthly').value = '0 VNĐ';
      }

      document.getElementById('modal-tai-khoan').classList.add('active');
    }

    // --- 3. CURRENCY FORMATTING & HELPERS ---
    function formatCurrency(num) {
      return new Intl.NumberFormat('vi-VN').format(num);
    }

    function parseCurrency(str) {
      if (!str) return 0;
      return parseFloat(str.toString().replace(/[^0-9]/g, '')) || 0;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      return dateStr;
    }

    // Auto-format currency inputs
    document.addEventListener('input', function (e) {
      if (e.target.classList.contains('currency-input')) {
        let val = parseCurrency(e.target.value);
        e.target.value = val ? formatCurrency(val) : '';
      }
    });

    function calculateMonthlyLoan() {
      const amount = parseCurrency(document.getElementById('fin-loan-amount').value);
      const term = parseInt(document.getElementById('fin-loan-term').value) || 1;
      const monthly = Math.round(amount / term);
      document.getElementById('fin-loan-monthly').value = formatCurrency(monthly) + ' VNĐ/tháng';
    }

    // --- 4. CRUD OPERATIONS & DOM UPDATES ---

    // Generic Delete Function
    function deleteItem(id, type) {
      if (confirm('Bạn có chắc chắn muốn xóa mục này?')) {
        const el = document.getElementById(id);
        if (el) el.remove();
        updateCounts();
        updateDashboardStats();
      }
    }

    // Progress Toggle & Subtasks
    function toggleSubtasks(cardId, btn) {
      const card = document.getElementById(cardId);
      const subSection = card.querySelector('.subtask-section');
      if (subSection) {
        subSection.classList.toggle('active');
        btn.classList.toggle('expanded');
      }
    }

    function updateProgress(cardId) {
      const card = document.getElementById(cardId);
      const checkboxes = card.querySelectorAll('.subtask-list input[type="checkbox"]');
      if (checkboxes.length === 0) return;

      let checked = 0;
      checkboxes.forEach(cb => {
        const item = cb.closest('.subtask-item');
        if (cb.checked) {
          checked++;
          if (item) item.classList.add('completed');
        } else {
          if (item) item.classList.remove('completed');
        }
      });

      const percent = Math.round((checked / checkboxes.length) * 100);
      const percentEl = card.querySelector('.progress-percent');
      const fillEl = card.querySelector('.progress-fill');

      if (percentEl) percentEl.textContent = percent + '%';
      if (fillEl) fillEl.style.width = percent + '%';
    }

    function addSubtask(cardId, btn) {
      const input = btn.previousElementSibling;
      const text = input.value.trim();
      if (!text) return;

      const card = document.getElementById(cardId);
      const subList = card.querySelector('.subtask-list');

      const item = document.createElement('div');
      item.className = 'subtask-item';
      item.innerHTML = `
        <input type="checkbox" onchange="updateProgress('${cardId}')">
        <span>${text}</span>
      `;

      subList.appendChild(item);
      input.value = '';
      updateProgress(cardId);
    }

    function toggleSingleTaskComplete(checkbox) {
      const card = checkbox.closest('.card');
      if (checkbox.checked) {
        card.classList.add('completed-card');
      } else {
        card.classList.remove('completed-card');
      }
    }

    function toggleSettled(checkbox, cardId) {
      const card = document.getElementById(cardId);
      if (checkbox.checked) {
        card.classList.add('completed-card');
      } else {
        card.classList.remove('completed-card');
      }
      updateDashboardStats();
    }

    // Save Project
    function saveProject() {
      const name = document.getElementById('project-name').value.trim();
      const start = document.getElementById('project-start-date').value;
      const end = document.getElementById('project-end-date').value;
      const type = document.getElementById('project-type').value;
      const budget = document.getElementById('project-budget').value || '0';
      const note = document.getElementById('project-note').value.trim();
      const editId = document.getElementById('edit-project-id').value;

      if (!name) { alert('Vui lòng nhập tên dự án!'); return; }

      if (editId) {
        const card = document.getElementById(editId);
        card.dataset.name = name;
        card.dataset.start = start;
        card.dataset.end = end;
        card.dataset.type = type;
        card.dataset.budget = budget;
        card.dataset.note = note;

        card.querySelector('.badge-type').textContent = type;
        card.querySelector('.card-title').textContent = name;
        card.querySelector('.card-date').textContent = `${formatDate(start)} - ${formatDate(end)}`;
        card.querySelector('.card-budget').textContent = `${budget} VNĐ`;
        card.querySelector('.card-note').textContent = note;
      } else {
        const id = 'proj-' + Date.now();
        const html = `
          <div class="card" id="${id}" data-name="${name}" data-start="${start}" data-end="${end}" data-type="${type}" data-budget="${budget}" data-note="${note}">
            <div class="card-header">
              <div><span class="badge-type" style="background:#eef5e3; color:#2e7d32; font-size:11px; padding:3px 8px; border-radius:4px; font-weight:bold;">${type}</span></div>
              <div class="action-icons">
                <button class="btn-icon" title="Sửa" onclick="editProject('${id}')">✏️</button>
                <button class="btn-icon" title="Xóa" onclick="deleteItem('${id}', 'project')">🗑️</button>
                <button class="toggle-arrow" onclick="toggleSubtasks('${id}', this)">▼</button>
              </div>
            </div>
            <h3 class="card-title" style="margin: 8px 0 4px; font-size: 16px;">${name}</h3>
            <p style="font-size:12px; color:#666; margin-bottom: 4px;">Thời gian: <b class="card-date">${formatDate(start)} - ${formatDate(end)}</b></p>
            <p style="font-size:13px; color:#555;">Ngân sách: <b class="card-budget">${budget} VNĐ</b></p>
            <p style="font-size:12px; color:#777; margin-top:4px;">Ghi chú: <span class="card-note">${note}</span></p>
            <div class="progress-container">
              <div class="progress-info"><span>Tiến độ thực hiện</span><b class="progress-percent">0%</b></div>
              <div class="progress-bg"><div class="progress-fill" style="width: 0%;"></div></div>
            </div>
            <div class="subtask-section">
              <div class="subtask-list"></div>
              <div class="add-task-row">
                <input type="text" placeholder="Thêm nhiệm vụ chi tiết...">
                <button onclick="addSubtask('${id}', this)">Thêm</button>
              </div>
            </div>
          </div>
        `;
        document.getElementById('work-project-list').insertAdjacentHTML('beforeend', html);
      }

      closeModal('modal-du-an');
      updateCounts();
      updateDashboardStats();
    }

    function editProject(id) {
      const card = document.getElementById(id);
      document.getElementById('modal-project-title').textContent = 'Chỉnh Sửa Dự Án';
      document.getElementById('edit-project-id').value = id;
      document.getElementById('project-name').value = card.dataset.name || '';
      document.getElementById('project-start-date').value = card.dataset.start || '';
      document.getElementById('project-end-date').value = card.dataset.end || '';
      document.getElementById('project-type').value = card.dataset.type || 'DVCI';
      document.getElementById('project-budget').value = card.dataset.budget || '';
      document.getElementById('project-note').value = card.dataset.note || '';
      document.getElementById('modal-du-an').classList.add('active');
    }

    // Save Single Work
    function saveSingleWork() {
      const name = document.getElementById('single-work-name').value.trim();
      const start = document.getElementById('single-work-start-date').value;
      const note = document.getElementById('single-work-note').value.trim();
      const editId = document.getElementById('edit-single-id').value;

      if (!name) { alert('Vui lòng nhập tên công việc!'); return; }

      if (editId) {
        const card = document.getElementById(editId);
        card.dataset.name = name;
        card.dataset.start = start;
        card.dataset.note = note;
        card.querySelector('.card-title').textContent = name;
        card.querySelector('.card-date').textContent = formatDate(start);
        card.querySelector('.card-note').textContent = note;
      } else {
        const id = 'single-' + Date.now();
        const html = `
          <div class="card" id="${id}" data-name="${name}" data-start="${start}" data-note="${note}">
            <div class="card-header" style="justify-content: flex-end;">
              <div class="action-icons">
                <button class="btn-icon" title="Sửa" onclick="editSingleWork('${id}')">✏️</button>
                <button class="btn-icon" title="Xóa" onclick="deleteItem('${id}', 'single')">🗑️</button>
              </div>
            </div>
            <div class="subtask-item">
              <input type="checkbox" onchange="toggleSingleTaskComplete(this)">
              <span class="card-title" style="font-size: 15px; font-weight: 600;">${name}</span>
            </div>
            <p style="font-size:12px; color:#666; margin-top:6px; margin-left: 24px;">Ngày bắt đầu: <b class="card-date">${formatDate(start)}</b></p>
            <p style="font-size:12px; color:#777; margin-top:2px; margin-left: 24px;">Ghi chú: <span class="card-note">${note}</span></p>
          </div>
        `;
        document.getElementById('work-single-list').insertAdjacentHTML('beforeend', html);
      }

      closeModal('modal-viec-rieng-le');
      updateCounts();
      updateDashboardStats();
    }

    function editSingleWork(id) {
      const card = document.getElementById(id);
      document.getElementById('modal-single-title').textContent = 'Chỉnh Sửa Việc Riêng Lẻ';
      document.getElementById('edit-single-id').value = id;
      document.getElementById('single-work-name').value = card.dataset.name || '';
      document.getElementById('single-work-start-date').value = card.dataset.start || '';
      document.getElementById('single-work-note').value = card.dataset.note || '';
      document.getElementById('modal-viec-rieng-le').classList.add('active');
    }

    // Save Finance Item (Credit / Saving / Loan)
    function saveFinanceItem() {
      const name = document.getElementById('fin-name').value.trim();
      const note = document.getElementById('fin-note').value.trim();
      const editId = document.getElementById('edit-finance-id').value;

      if (!name) { alert('Vui lòng nhập tên!'); return; }

      if (currentFinanceTab === 'credit') {
        const cardType = document.getElementById('fin-card-type').value;
        const grace = document.getElementById('fin-grace-period').value;
        const limit = document.getElementById('fin-credit-limit').value || '0';
        const stmt = document.getElementById('fin-statement-date').value;
        const due = document.getElementById('fin-due-date').value;

        if (editId) {
          const card = document.getElementById(editId);
          card.dataset.name = name;
          card.dataset.cardtype = cardType;
          card.dataset.grace = grace;
          card.dataset.limit = limit;
          card.dataset.stmt = stmt;
          card.dataset.due = due;
          card.dataset.note = note;

          card.querySelector('.card-bank-name').textContent = name;
          card.querySelector('.card-type-title').textContent = cardType;
          card.querySelector('.badge-grace').textContent = grace + ' miễn lãi';
          card.querySelector('.card-limit').textContent = `${limit} đ`;
          card.querySelector('.card-stmt').textContent = `Ngày ${stmt || '--'}`;
          card.querySelector('.card-due').textContent = `Ngày ${due || '--'}`;
        } else {
          const id = 'card-credit-' + Date.now();
          const html = `
            <div class="credit-card" id="${id}" data-name="${name}" data-cardtype="${cardType}" data-grace="${grace}" data-limit="${limit}" data-stmt="${stmt}" data-due="${due}" data-note="${note}">
              <div class="badge-group">
                <div class="badge badge-grace">${grace} miễn lãi</div>
                <button class="btn-edit-card" title="Sửa" onclick="editCreditCard('${id}')">✏️</button>
                <button class="btn-edit-card" title="Xóa" onclick="deleteItem('${id}', 'credit')">🗑️</button>
              </div>
              <div class="card-bank-name" style="font-size: 13px; opacity: 0.9;">${name}</div>
              <div class="card-type-title" style="font-size: 20px; font-weight: bold; margin: 8px 0;">${cardType}</div>
              <div style="display: flex; justify-content: space-between; font-size: 12px;">
                <div>Hạn mức:<br><b class="card-limit">${limit} đ</b></div>
                <div style="text-align: right;">Sao kê: <b class="card-stmt">Ngày ${stmt || '--'}</b><br>Hạn trả: <b class="card-due">Ngày ${due || '--'}</b></div>
              </div>
            </div>
          `;
          document.getElementById('list-credit').insertAdjacentHTML('beforeend', html);
        }
      } else if (currentFinanceTab === 'saving') {
        const category = document.getElementById('fin-saving-category').value;
        const custType = document.getElementById('fin-customer-type').value;
        const amount = document.getElementById('fin-saving-amount').value || '0';
        const term = document.getElementById('fin-saving-term').value;

        if (editId) {
          const card = document.getElementById(editId);
          card.dataset.name = name;
          card.dataset.category = category;
          card.dataset.custtype = custType;
          card.dataset.amount = amount;
          card.dataset.term = term;
          card.dataset.note = note;

          card.querySelector('.badge-category').textContent = category;
          card.querySelector('.badge-custtype').textContent = custType;
          card.querySelector('.card-title').textContent = name;
          card.querySelector('.card-amount').textContent = `${amount} VNĐ`;
          card.querySelector('.card-term').textContent = term;
          card.querySelector('.card-note').textContent = note;
        } else {
          const id = 'saving-' + Date.now();
          const html = `
            <div class="card" id="${id}" data-name="${name}" data-category="${category}" data-custtype="${custType}" data-amount="${amount}" data-term="${term}" data-note="${note}">
              <div class="card-header">
                <div>
                  <span class="badge-category" style="background:#e3f2fd; color:#1565c0; font-size:11px; padding:3px 8px; border-radius:4px; font-weight:bold;">${category}</span>
                  <span class="tag-object badge-custtype">${custType}</span>
                </div>
                <div class="action-icons">
                  <button class="btn-icon" title="Sửa" onclick="editSavingItem('${id}')">✏️</button>
                  <button class="btn-icon" title="Xóa" onclick="deleteItem('${id}', 'saving')">🗑️</button>
                </div>
              </div>
              <h3 class="card-title" style="margin: 8px 0 4px; font-size: 16px;">${name}</h3>
              <p style="font-size:13px; color:#555;">Số tiền: <b class="card-amount" style="color:#2e7d32;">${amount} VNĐ</b></p>
              <p style="font-size:12px; color:#666; margin-top:2px;">Kỳ hạn: <b class="card-term">${term}</b></p>
              <p style="font-size:12px; color:#777; margin-top:4px;">Ghi chú: <span class="card-note">${note}</span></p>
              <label class="settle-check-footer">
                <input type="checkbox" onchange="toggleSettled(this, '${id}')"> Đã tất toán
              </label>
            </div>
          `;
          document.getElementById('list-saving').insertAdjacentHTML('beforeend', html);
        }
      } else if (currentFinanceTab === 'loan') {
        const amount = document.getElementById('fin-loan-amount').value || '0';
        const term = document.getElementById('fin-loan-term').value;
        const monthly = document.getElementById('fin-loan-monthly').value;

        if (editId) {
          const card = document.getElementById(editId);
          card.dataset.name = name;
          card.dataset.amount = amount;
          card.dataset.term = term;
          card.dataset.note = note;

          card.querySelector('.card-title').textContent = name;
          card.querySelector('.card-amount').textContent = `${amount} VNĐ`;
          card.querySelector('.card-term').textContent = `${term} tháng`;
          card.querySelector('.card-monthly').textContent = monthly;
          card.querySelector('.card-note').textContent = note;
        } else {
          const id = 'loan-' + Date.now();
          const numTerm = parseInt(term) || 12;
          const monthlyVal = Math.round(parseCurrency(amount) / numTerm);
          let subtasksHtml = '';
          for (let i = 1; i <= numTerm; i++) {
            subtasksHtml += `
              <div class="subtask-item">
                <input type="checkbox" onchange="updateProgress('${id}')">
                <span>Kỳ ${i}: ${formatCurrency(monthlyVal)} VNĐ</span>
              </div>
            `;
          }

          const html = `
            <div class="card" id="${id}" data-name="${name}" data-amount="${amount}" data-term="${term}" data-note="${note}">
              <div class="card-header">
                <div>
                  <span style="background:#ffebee; color:#c62828; font-size:11px; padding:3px 8px; border-radius:4px; font-weight:bold;">Trả góp</span>
                  <span style="font-size:11px; color:#888; margin-left: 6px;">Kỳ hạn: <b class="card-term">${term} tháng</b></span>
                </div>
                <div class="action-icons">
                  <button class="btn-icon" title="Sửa" onclick="editLoanItem('${id}')">✏️</button>
                  <button class="btn-icon" title="Xóa" onclick="deleteItem('${id}', 'loan')">🗑️</button>
                  <button class="toggle-arrow" onclick="toggleSubtasks('${id}', this)">▼</button>
                </div>
              </div>
              <h3 class="card-title" style="margin: 8px 0 4px; font-size: 16px;">${name}</h3>
              <p style="font-size:13px; color:#555;">Tổng tiền vay: <b class="card-amount" style="color:#c62828;">${amount} VNĐ</b></p>
              <p style="font-size:12px; color:#333; font-weight:bold; margin-top:2px;">Góp hàng tháng: <span class="card-monthly">${formatCurrency(monthlyVal)} VNĐ/tháng</span></p>
              <p style="font-size:12px; color:#777; margin-top:4px;">Ghi chú: <span class="card-note">${note}</span></p>
              <div class="progress-container">
                <div class="progress-info"><span>Đã hoàn thành</span><b class="progress-percent">0%</b></div>
                <div class="progress-bg"><div class="progress-fill" style="width: 0%;"></div></div>
              </div>
              <div class="subtask-section">
                <div class="subtask-list">${subtasksHtml}</div>
              </div>
            </div>
          `;
          document.getElementById('list-loan').insertAdjacentHTML('beforeend', html);
        }
      }

      closeModal('modal-tai-khoan');
      updateDashboardStats();
    }

    function editCreditCard(id) {
      const card = document.getElementById(id);
      switchFinanceTab('credit');
      document.getElementById('modal-finance-title').textContent = 'Chỉnh Sửa Thẻ Tín Dụng';
      document.getElementById('edit-finance-id').value = id;
      document.getElementById('fin-name').value = card.dataset.name || '';
      document.getElementById('fin-card-type').value = card.dataset.cardtype || 'VISA';
      document.getElementById('fin-grace-period').value = card.dataset.grace || '45 ngày';
      document.getElementById('fin-credit-limit').value = card.dataset.limit || '';
      document.getElementById('fin-statement-date').value = card.dataset.stmt || '';
      document.getElementById('fin-due-date').value = card.dataset.due || '';
      document.getElementById('fin-note').value = card.dataset.note || '';
      openAddFinanceModal();
      document.getElementById('edit-finance-id').value = id;
      document.getElementById('fin-name').value = card.dataset.name || '';
      document.getElementById('fin-credit-limit').value = card.dataset.limit || '';
    }

    function editSavingItem(id) {
      const card = document.getElementById(id);
      switchFinanceTab('saving');
      openAddFinanceModal();
      document.getElementById('modal-finance-title').textContent = 'Chỉnh Sửa Khoản Gửi / Cho Vay';
      document.getElementById('edit-finance-id').value = id;
      document.getElementById('fin-name').value = card.dataset.name || '';
      document.getElementById('fin-saving-category').value = card.dataset.category || 'Tiết kiệm';
      document.getElementById('fin-customer-type').value = card.dataset.custtype || 'Cá nhân';
      document.getElementById('fin-saving-amount').value = card.dataset.amount || '';
      document.getElementById('fin-saving-term').value = card.dataset.term || 'Không kỳ hạn';
      document.getElementById('fin-note').value = card.dataset.note || '';
    }

    function editLoanItem(id) {
      const card = document.getElementById(id);
      switchFinanceTab('loan');
      openAddFinanceModal();
      document.getElementById('modal-finance-title').textContent = 'Chỉnh Sửa Khoản Vay / Trả Góp';
      document.getElementById('edit-finance-id').value = id;
      document.getElementById('fin-name').value = card.dataset.name || '';
      document.getElementById('fin-loan-amount').value = card.dataset.amount || '';
      document.getElementById('fin-loan-term').value = card.dataset.term || '12';
      document.getElementById('fin-note').value = card.dataset.note || '';
      calculateMonthlyLoan();
    }

    // --- 5. COUNTS & DASHBOARD RECALCULATION ---
    function updateCounts() {
      const projCount = document.querySelectorAll('#work-project-list .card').length;
      const singleCount = document.querySelectorAll('#work-single-list .card').length;
      document.getElementById('project-count').textContent = projCount;
      document.getElementById('single-work-count').textContent = singleCount;
    }

    function updateDashboardStats() {
      // 1. Projects & Single Works Count
      const projCount = document.querySelectorAll('#work-project-list .card').length;
      const singleCount = document.querySelectorAll('#work-single-list .card').length;
      document.getElementById('home-stat-projects').textContent = projCount;
      document.getElementById('home-stat-singles').textContent = singleCount;

      // 2. Credit Cards Total
      const creditCards = document.querySelectorAll('#list-credit .credit-card');
      let totalLimit = 0;
      creditCards.forEach(c => {
        totalLimit += parseCurrency(c.dataset.limit);
      });
      document.getElementById('home-stat-credit-count').textContent = creditCards.length;
      document.getElementById('home-stat-credit-limit').textContent = formatCurrency(totalLimit) + ' VNĐ';

      // 3. Debtors (Saving / Lending) - filter out settled ones
      const savingCards = document.querySelectorAll('#list-saving .card');
      let personalTotal = 0;
      let orgTotal = 0;

      savingCards.forEach(c => {
        const isSettled = c.classList.contains('completed-card');
        if (!isSettled) {
          const amt = parseCurrency(c.dataset.amount);
          if (c.dataset.custtype === 'Tổ chức') {
            orgTotal += amt;
          } else {
            personalTotal += amt;
          }
        }
      });
      document.getElementById('home-stat-debtor-personal').textContent = formatCurrency(personalTotal) + ' VNĐ';
      document.getElementById('home-stat-debtor-org').textContent = formatCurrency(orgTotal) + ' VNĐ';

      // 4. Creditors (Loans)
      const loanCards = document.querySelectorAll('#list-loan .card');
      document.getElementById('home-stat-creditor-count').textContent = loanCards.length;
    }

    // --- 6. INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      // Set Solar Date
      const today = new Date();
      const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
      const dateStr = `${days[today.getDay()]}, ${today.getDate()}/${today.getMonth() + 1}/${today.getFullYear()}`;
      document.getElementById('solar-date-text').textContent = dateStr;

      // Initial Recalculation
      updateCounts();
      updateDashboardStats();
    });
  </script>
</body>
</html>
